  <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,

doc,

getDoc

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===========================
Firebase
=========================== */

const firebaseConfig = {

apiKey:"AIzaSyCDoHtDphHNZoZfCV2pXqJ3LD8JzzXSHFw",

authDomain:"match3t.firebaseapp.com",

projectId:"match3t",

storageBucket:"match3t.firebasestorage.app",

messagingSenderId:"966340184804",

appId:"1:966340184804:web:aedda5fac457d0907e3af1"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

/* ===========================
قراءة معرف المباراة
=========================== */

const params = new URLSearchParams(window.location.search);

const eventId = params.get("id");

/* ===========================
ترجمة المرحلة
=========================== */

function translateStage(stage){

if(!stage) return "";

const stages={

"GROUP_STAGE":"دور المجموعات",

"LAST_32":"دور الـ32",

"LAST_16":"دور الـ16",

"QUARTER_FINALS":"ربع النهائي",

"SEMI_FINALS":"نصف النهائي",

"FINAL":"النهائي"

};

return stages[stage] || stage;

}

/* ===========================
ترجمة الحالة
=========================== */

function translateStatus(status){

switch(status){

case "IN_PLAY":
case "LIVE":
case "PAUSED":
return "🔴 بث مباشر الآن";

case "TIMED":
return "⏳ لم تبدأ";

case "FINISHED":
return "✔ انتهت";

default:
return "";

}

}

/* ===========================
تحويل رابط يوتيوب إلى Embed
=========================== */

function convertYoutube(url){

if(!url) return "";

if(url.includes("/embed/")) return url;

let id="";

const watch=url.match(/[?&]v=([^&]+)/);
if(watch) id=watch[1];

const short=url.match(/youtu\.be\/([^?&]+)/);
if(short) id=short[1];

const live=url.match(/youtube\.com\/live\/([^?&]+)/);
if(live) id=live[1];

const shorts=url.match(/shorts\/([^?&]+)/);
if(shorts) id=shorts[1];

if(id==="") return "";

return `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&playsinline=1`;

    }

/* ===========================
جلب بيانات المباراة
=========================== */

async function loadMatch(){

if(!eventId){

alert("معرف المباراة غير موجود");

return;

}
  
/* ===========================
بيانات البث
=========================== */

const liveRef=doc(db,"liveStreams",eventId);

const liveSnap=await getDoc(liveRef);

if(!liveSnap.exists()){

document.getElementById("status").textContent="لا يوجد بث مباشر";

return;

}

const live=liveSnap.data();

document.getElementById("team1").textContent = live.team1 || "";

document.getElementById("team2").textContent = live.team2 || "";

document.getElementById("logo1").src = live.logo1 || "";

document.getElementById("logo2").src = live.logo2 || "";

document.getElementById("stage").textContent =
translateStage(live.group);

if(live.background){

document.body.style.backgroundImage=`url(${live.background})`;

document.body.style.backgroundSize="cover";

document.body.style.backgroundPosition="center";

    }

/* الحالة */

document.getElementById("status").textContent=

translateStatus(live.status);

/* ===========================
تحديد نوع البث
=========================== */

let playerUrl="";

if(live.type==="youtube"){

playerUrl=convertYoutube(live.url);

}

else{

playerUrl=live.url;

}

/* تشغيل البث */

document.getElementById("playerFrame").src=playerUrl;

  }
/* ===========================
تشغيل الصفحة
=========================== */

loadMatch();

/* ===========================
زر ملء الشاشة
=========================== */

const frame = document.getElementById("playerFrame");

const playerBox = document.querySelector(".playerBox");

document.getElementById("fullscreenBtn").onclick = () => {

if(playerBox.requestFullscreen){

playerBox.requestFullscreen();

}

else if(playerBox.webkitRequestFullscreen){

playerBox.webkitRequestFullscreen();

}

else if(playerBox.msRequestFullscreen){

playerBox.msRequestFullscreen();

}

};

/* ===========================
إخفاء الشعارات التالفة
=========================== */

document.addEventListener(

"error",

function(e){

if(e.target.tagName==="IMG"){

e.target.style.display="none";

}

},

true

);
