<body>

<header>
ماتشات
</header>

<div class="liveBar">
🔴 البث المباشر
</div>

<div class="container">

<div class="matchTitle">
مصر × نيوزيلندا
</div>

<div class="liveIndicator">
🔴 المباراة مباشرة الآن
</div>

<div
class="playerBox"
id="playerBox">

<iframe
allowfullscreen="true"
frameborder="0"
scrolling="1"
src="https://eg.onlineworldcup2026.com/albaplayer/sports-1/">
</iframe>

<div class="topMask"></div>

<div class="clickBlock"></div>

</div>

<div class="buttons">

<button
class="btn fullBtn"
onclick="openFullscreen()">
⛶ ملء الشاشة
</button>

<a
href="/"
class="btn homeBtn">
🏠 الصفحة الرئيسية
</a>

</div>

<div class="notice">

مرحباً بك في البث المباشر عبر برنامج ماتشات

<br><br>

نتمنى لكم مشاهدة ممتعة

</div>

</div>

<footer>

تطوير : Mohamed Hosny Hora

<br><br>

جميع الحقوق محفوظة © 2026

</footer>

<script>

function openFullscreen(){

const elem =
document.getElementById(
"playerBox"
);

if(elem.requestFullscreen){

elem.requestFullscreen();

}

}

/* منع القائمة اليمنى */

document.addEventListener(
"contextmenu",
e=>e.preventDefault()
);

/* منع تحديد النص */

document.addEventListener(
"selectstart",
e=>e.preventDefault()
);

/* منع السحب */

document.addEventListener(
"dragstart",
e=>e.preventDefault()
);

</script>

</body>
