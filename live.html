<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>البث المباشر | ماتشات</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#111;
color:white;
min-height:100vh;
}

header{
background:#0f7a39;
padding:18px;
text-align:center;
font-size:32px;
font-weight:bold;
}

.liveBar{
background:#dc3545;
padding:12px;
text-align:center;
font-weight:bold;
font-size:18px;
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:.5;}
100%{opacity:1;}
}

.container{
max-width:1200px;
margin:auto;
padding:15px;
}

.matchTitle{
text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:15px;
}

.playerBox{
position:relative;
width:100%;
height:78vh;
background:#000;
border-radius:25px;
overflow:hidden;
box-shadow:0 0 30px rgba(0,0,0,.6);
}

.playerBox iframe{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
border:none;
}

/* إخفاء العناصر العلوية */

.topMask{
position:absolute;
top:0;
left:0;
width:100%;
height:28%;
background:#000;
z-index:1000;
pointer-events:none;
}

/* منع الضغط داخل البث */

.clickBlock{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
z-index:2000;
background:transparent;
}

.buttons{
display:flex;
gap:10px;
margin-top:15px;
}

.btn{
flex:1;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
cursor:pointer;
color:white;
}

.fullBtn{
background:#1877f2;
}

.stopBtn{
background:#dc3545;
}

.homeBtn{
background:#0f7a39;
text-decoration:none;
display:flex;
align-items:center;
justify-content:center;
}

.notice{
margin-top:20px;
background:#222;
padding:15px;
border-radius:15px;
text-align:center;
line-height:1.8;
}

footer{
background:#0f7a39;
padding:20px;
text-align:center;
margin-top:20px;
font-weight:bold;
}

</style>

</head>

<body>

<header>
ماتشات
</header>

<div class="liveBar">
🔴 بث مباشر
</div>

<div class="container">

<div class="matchTitle">
البث المباشر
</div>

<div class="playerBox" id="playerBox">

<iframe
id="liveFrame"
allowfullscreen="true"
frameborder="0"
scrolling="1"
src="https://player.syria-player.live/albaplayer/beinmax1/?serv=0">
</iframe>

<div class="topMask"></div>

<div class="clickBlock"></div>

</div>

<div class="buttons">

<button
class="btn fullBtn"
onclick="openFullscreen()">
⛶ ملء الشاشة
</button>

<button
class="btn stopBtn"
onclick="togglePlayer()">
⏸ إيقاف البث
</button>

<a
href="/"
class="btn homeBtn">
🏠 الصفحة الرئيسية
</a>

</div>

<div class="notice">
مرحباً بك في البث المباشر عبر موقع ماتشات
</div>

</div>

<footer>

تطوير : Mohamed Hosny Hora

<br><br>

جميع الحقوق محفوظة © 2026

</footer>

<script>

function openFullscreen(){

const elem =
document.getElementById(
"playerBox"
);

if(elem.requestFullscreen){

elem.requestFullscreen();

}

}

let stopped = false;

function togglePlayer(){

const frame =
document.getElementById(
"liveFrame"
);

const btn =
document.querySelector(
".stopBtn"
);

if(!stopped){

frame.src =
"about:blank";

btn.innerHTML =
"▶ تشغيل البث";

stopped = true;

}else{

frame.src =
"https://player.syria-player.live/albaplayer/beinmax1/?serv=0";

btn.innerHTML =
"⏸ إيقاف البث";

stopped = false;

}

}

document.addEventListener(
"contextmenu",
e=>e.preventDefault()
);

document.addEventListener(
"selectstart",
e=>e.preventDefault()
);

document.addEventListener(
"dragstart",
e=>e.preventDefault()
);

</script>

</body>
  </html>
