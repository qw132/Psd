<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>البث المباشر | ماتشات</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#111;
color:white;
min-height:100vh;
}

header{
background:#0f7a39;
padding:18px;
text-align:center;
font-size:32px;
font-weight:bold;
}

.liveBar{
background:#dc3545;
padding:12px;
text-align:center;
font-weight:bold;
font-size:18px;
animation:blink 1s infinite;
}

@keyframes blink{

0%{opacity:1;}
50%{opacity:.5;}
100%{opacity:1;}

}

.container{
max-width:1200px;
margin:auto;
padding:15px;
}

.matchTitle{
text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:15px;
}

.playerBox{
background:#000;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 25px rgba(0,0,0,.5);
width:100%;
height:70vh;
min-height:450px;
}

.playerBox iframe{
width:100%;
height:100%;
border:none;
display:block;
}

.buttons{
display:flex;
gap:10px;
margin-top:15px;
}

.btn{
flex:1;
padding:14px;
border:none;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
text-align:center;
color:white;
}

.homeBtn{
background:#0f7a39;
}

.fullBtn{
background:#007bff;
}

.notice{
margin-top:20px;
background:#222;
padding:15px;
border-radius:15px;
text-align:center;
line-height:1.8;
font-size:16px;
}

footer{
background:#0f7a39;
padding:20px;
text-align:center;
margin-top:20px;
font-weight:bold;
}

</style>

</head>

<body>

<header>
ماتشات
</header>

<div class="liveBar">
🔴 بث مباشر
</div>

<div class="container">

<div class="matchTitle">
مصر × نيوزيلندا
</div>

<div class="playerBox" id="playerBox">

<iframe
allowfullscreen="true"
frameborder="0"
scrolling="1"
src="https://eg.onlineworldcup2026.com/albaplayer/sports-1/"
width="100%"
height="100%">
</iframe>

</div>

<div class="buttons">

<a
href="/"
class="btn homeBtn">
العودة للرئيسية
</a>

<button
class="btn fullBtn"
onclick="openFullscreen()">
ملء الشاشة
</button>

</div>

<div class="notice">

مرحباً بك في البث المباشر عبر برنامج ماتشات

</div>

</div>

<footer>

تطوير : Mohamed Hosny Hora

<br><br>

جميع الحقوق محفوظة © 2026

</footer>

<script>

function openFullscreen(){

const elem =
document.getElementById("playerBox");

if(elem.requestFullscreen){

elem.requestFullscreen();

}

}

/* منع القائمة اليمنى */

document.addEventListener(
"contextmenu",
e=>e.preventDefault()
);

/* منع تحديد النص */

document.addEventListener(
"selectstart",
e=>e.preventDefault()
);

</script>

</body>
</html>
