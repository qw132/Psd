<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>GDW3L</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

html,body{
min-height:100vh;
background:#0d5e25;
color:#fff;
}

body::before{
content:"";
position:fixed;
inset:0;
background:url("worldcup.png") center center no-repeat;
background-size:350px;
opacity:.06;
pointer-events:none;
z-index:-1;
}

header{
background:#0f7b31;
padding:20px;
text-align:center;
font-size:40px;
font-weight:bold;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.match{
background:#fff;
color:#222;
border-radius:18px;
padding:20px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.team{
width:35%;
text-align:center;
}

.team img{
width:90px;
height:90px;
object-fit:contain;
}

.center{
width:30%;
text-align:center;
}

.status{
margin-top:10px;
padding:10px;
border-radius:10px;
font-weight:bold;
color:white;
}

.notstarted{
background:#007bff;
}

.live{
background:#28a745;
}

.finished{
background:#dc3545;
}

.developer{
text-align:center;
padding:15px;
font-weight:bold;
}

footer{
background:#0f7b31;
padding:15px;
text-align:center;
}

.support{
position:fixed;
bottom:20px;
left:20px;
background:#25D366;
color:white;
padding:14px 22px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<header>
GDW3L
</header>

<div class="container" id="matches"></div>

<div class="developer">
المطور : Mohamed Hosny
</div>

<footer>
جميع الحقوق محفوظة Mohamed Hosny Hora 2026 ®
</footer>

<a class="support"
href="https://wa.me/201040507023"
target="_blank">
الدعم
</a>

<script>

function getStatus(dateTime){

let start=new Date(dateTime);

let end=new Date(start.getTime()+7200000);

let now=new Date();

if(now<start){
return{
text:"لم تبدأ",
class:"notstarted"
};
}

if(now>=start&&now<=end){
return{
text:"جارية الآن",
class:"live"
};
}

return{
text:"انتهت",
class:"finished"
};

}

function loadMatches(){

let matches=
JSON.parse(localStorage.getItem("matches"))||[];

let html="";

matches.forEach(match=>{

let status=getStatus(match.datetime);

html+=`

<div class="match">

<div class="team">
<img src="${match.logo1}">
<h3>${match.team1}</h3>
</div>

<div class="center">
<h3>${match.date}</h3>
<p>${match.time}</p>

<div class="status ${status.class}">
${status.text}
</div>
</div>

<div class="team">
<img src="${match.logo2}">
<h3>${match.team2}</h3>
</div>

</div>

`;

});

document.getElementById("matches").innerHTML=html;

}

loadMatches();

setInterval(loadMatches,60000);

</script>

</body>
  </html>
