<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ماتشات</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
rel="stylesheet">

<style>
  *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

:root{

--bg:#050505;

--header:#101010;

--card:#f8f8f8;

--text:#111;

--green:#19a84a;

--blue:#3567e6;

--red:#d92c2c;

--gray:#e8e8e8;

--shadow:
0 5px 18px rgba(0,0,0,.22);

}

body{

background:var(--bg);

min-height:100vh;

overflow-x:hidden;

}

/* HEADER */

.header{

position:fixed;

top:0;
right:0;
left:0;

height:92px;

background:var(--header);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 14px;

z-index:9999;

}

.logo{

width:190px;

display:block;

margin:auto;

}

.searchBtn{

width:48px;
height:48px;

border:none;

border-radius:16px;

background:#222;

color:#fff;

font-size:20px;

cursor:pointer;

}

.placeholder{

width:48px;

}

/* SEARCH */

.searchBar{

position:fixed;

top:92px;

right:0;
left:0;

padding:12px;

background:#121212;

display:none;

z-index:9998;

}

.searchBar.active{

display:block;

}

.searchInput{

width:100%;

height:48px;

border:none;

outline:none;

border-radius:14px;

padding:0 15px;

background:#222;

color:white;

font-size:15px;

}

/* CONTAINER */

.container{

max-width:760px;

margin:auto;

padding-top:110px;

padding-right:12px;

padding-left:12px;

padding-bottom:140px;

}

/* CARD */

.matchCard{

background:var(--card);

border-radius:28px;

padding:18px;

margin-bottom:16px;

box-shadow:var(--shadow);

}

/* TEAMS */

.teamsRow{

display:flex;

align-items:flex-start;

justify-content:space-between;

gap:10px;

}

.team{

width:30%;

text-align:center;

}

.teamLogo{

width:95px;

height:95px;

object-fit:contain;

display:block;

margin:auto;

}

.teamName{

margin-top:8px;

font-size:17px;

font-weight:800;

color:var(--text);

line-height:1.2;

word-break:break-word;

}

/* اسم طويل */

.teamName.long{

font-size:12px;

}

/* CENTER */

.centerBox{

width:40%;

text-align:center;

}

/* TIME */

.timeBox{

width:170px;

height:62px;

margin:auto;

background:#e5e5e5;

border-radius:30px;

display:flex;

align-items:center;

justify-content:center;

font-size:20px;

font-weight:900;

color:#222;

}

/* SCORE */

.scoreBox{

font-size:58px;

font-weight:900;

line-height:1;

color:#13853a;

}

/* TOURNAMENT */

.tournament{

margin-top:12px;

font-size:14px;

font-weight:800;

color:#555;

display:flex;

justify-content:center;

align-items:center;

gap:5px;

}

/* INFO ROW */

.bottomInfo{

display:flex;

gap:10px;

margin-top:16px;

}

.infoItem{

flex:1;

background:#ececec;

border-radius:14px;

padding:12px;

font-size:13px;

font-weight:700;

text-align:center;

color:#333;

}

/* STATUS */

.liveBadge{

margin-top:14px;

background:var(--green);

color:white;

border-radius:16px;

padding:12px;

font-size:17px;

font-weight:800;

text-align:center;

}

.notStartedBadge{

margin-top:14px;

background:var(--blue);

color:white;

border-radius:16px;

padding:12px;

font-size:17px;

font-weight:800;

text-align:center;

}

.finishedBadge{

margin-top:14px;

background:var(--red);

color:white;

border-radius:16px;

padding:12px;

font-size:17px;

font-weight:800;

text-align:center;

}

/* LOADING */

.loading,
.empty{

background:white;

border-radius:20px;

padding:25px;

text-align:center;

font-size:18px;

font-weight:800;

}

/* FOOTER */

.footer{

margin-top:25px;

padding:25px 10px;

text-align:center;

color:white;

font-size:14px;

}

.footer .dev{

font-weight:800;

margin-bottom:5px;

}

.footer .copy{

opacity:.8;

margin-bottom:12px;

}

.supportBtn{

display:inline-flex;

align-items:center;

justify-content:center;

gap:8px;

padding:10px 22px;

border-radius:18px;

background:
linear-gradient(
180deg,
#f4f4f4,
#bdbdbd
);

color:#111;

font-weight:800;

text-decoration:none;

box-shadow:
0 2px 10px rgba(255,255,255,.25);

}

/* MOBILE */

@media(max-width:480px){

.teamLogo{

width:80px;

height:80px;

}

.teamName{

font-size:15px;

}

.timeBox{

width:150px;

height:56px;

font-size:18px;

}

.scoreBox{

font-size:48px;

}

  }
  </style>

</head>

<body>

<div class="header">

<button
id="searchBtn"
class="searchBtn">

🔍

</button>

<img

src="file_00000000d0f871f4b728f73dff260688_1 (1).png"

class="logo"

alt="ماتشات">

<div class="placeholder"></div>

</div>

<div
id="searchBar"
class="searchBar">

<input

id="searchInput"

class="searchInput"

type="text"

placeholder="ابحث باسم فريق...">

</div>

<div
id="matches"
class="container">

<div class="loading">

جاري تحميل المباريات...

</div>

</div>

<footer class="footer">

<div class="dev">

Developer: Mohamed Hosny Hora

</div>

<div class="copy">

جميع الحقوق محفوظة 2026 ®

</div>

<a

class="supportBtn"

href="https://wa.me/201040507023"

target="_blank">

💬 الدعم

</a>

</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Firebase */

const firebaseConfig = {

apiKey:
"AIzaSyCDoHtDphHNZoZfCV2pXqJ3LD8JzzXSHFw",

authDomain:
"match3t.firebaseapp.com",

projectId:
"match3t",

storageBucket:
"match3t.firebasestorage.app",

messagingSenderId:
"966340184804",

appId:
"1:966340184804:web:aedda5fac457d0907e3af1"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

let matchesData = [];

let apiMatches = [];

let searchText = "";
  /* البحث */

const searchBtn =
document.getElementById(
"searchBtn"
);

const searchBar =
document.getElementById(
"searchBar"
);

const searchInput =
document.getElementById(
"searchInput"
);

searchBtn.addEventListener(
"click",
()=>{

searchBar.classList.toggle(
"active"
);

if(
searchBar.classList.contains(
"active"
)
){

searchInput.focus();

}

}
);

searchInput.addEventListener(
"input",
e=>{

searchText =
e.target.value
.trim()
.toLowerCase();

renderMatches();

}
);

/* تنسيق الوقت */

function formatTime12(timeString){

if(!timeString)
return "";

let [hours,minutes] =
timeString.split(":");

hours =
parseInt(hours);

let period = "AM";

if(hours >= 12){

period = "PM";

}

hours =
hours % 12;

if(hours === 0){

hours = 12;

}

return `${hours}:${minutes} ${period}`;

}

/* حالة المباراة */

function getMatchStatus(status){

if(

status === "IN_PLAY"

||

status === "LIVE"

||

status === "PAUSED"

){

return{

text:"جارية الآن",

className:
"liveBadge",

order:1

};

}

if(
status === "TIMED"
){

return{

text:"لم تبدأ",

className:
"notStartedBadge",

order:2

};

}

if(
status === "FINISHED"
){

return{

text:"انتهت",

className:
"finishedBadge",

order:3

};

}

return{

text:"لم تبدأ",

className:
"notStartedBadge",

order:2

};

}

/* فلترة البحث */

function matchSearch(match){

if(searchText === ""){

return true;

}

const team1 =
(match.team1 || "")
.toLowerCase();

const team2 =
(match.team2 || "")
.toLowerCase();

return(

team1.includes(searchText)

||

team2.includes(searchText)

);

}

/* تصغير أسماء الفرق الطويلة */

function isLongTeamName(name){

if(!name) return false;

return name.split(" ").length > 2;

  }
  /* ترتيب المباريات */

function sortMatches(){

matchesData.sort((a,b)=>{

const apiA =
apiMatches.find(
m =>
String(m.id) ===
String(a.eventId)
);

const apiB =
apiMatches.find(
m =>
String(m.id) ===
String(b.eventId)
);

const orderA =
getMatchStatus(
apiA?.status
).order;

const orderB =
getMatchStatus(
apiB?.status
).order;

/* الجارية أولاً */

if(orderA !== orderB){

return orderA - orderB;

}

/* الأقرب وقتاً */

const dateA =
new Date(
`${a.date || ""} ${a.time || ""}`
);

const dateB =
new Date(
`${b.date || ""} ${b.time || ""}`
);

return dateA - dateB;

});

}

/* حذف المباراة بعد 8 ساعات من انتهائها */

function shouldHideFinishedMatch(apiMatch){

if(
apiMatch?.status !==
"FINISHED"
){

return false;

}

const finishedTime =

apiMatch.finishedAt

||

apiMatch.lastUpdated

||

null;

if(!finishedTime){

return false;

}

const finishDate =
new Date(
finishedTime
);

const now =
new Date();

const hoursPassed =

(now - finishDate)

/

1000

/

60

/

60;

return hoursPassed >= 8;

}

/* جلب API */

async function loadApiMatches(){

try{

const response =
await fetch(
"/api/matches"
);

const data =
await response.json();

apiMatches =
data.matches || [];

sortMatches();

renderMatches();

}
catch(error){

console.log(
"API ERROR:",
error
);

}

}

/* Firebase Realtime */

onSnapshot(

collection(
db,
"matches"
),

(snapshot)=>{

matchesData = [];

snapshot.forEach(doc=>{

matchesData.push({

id:doc.id,

...doc.data()

});

});

sortMatches();

renderMatches();

}

);

/* أول تحميل */

loadApiMatches();

/* تحديث كل 30 ثانية */

setInterval(

()=>{

loadApiMatches();

},

30000

);
  /* رسم المباريات */

function renderMatches(){

const container =
document.getElementById(
"matches"
);

let html = "";

matchesData.forEach(match=>{

const apiMatch =
apiMatches.find(
m =>
String(m.id) ===
String(match.eventId)
);

/* البحث */

if(
!matchSearch(match)
){

return;

}

/* إخفاء المنتهية بعد 8 ساعات */

if(
shouldHideFinishedMatch(
apiMatch
)
){

return;

}

const status =
getMatchStatus(
apiMatch?.status
);

/* الوقت أو النتيجة */

let centerContent = `

<div class="timeBox">

${formatTime12(
match.time
)}

</div>

`;

if(

apiMatch?.score

&&

apiMatch.score.fullTime

&&

apiMatch.score.fullTime.home !== null

&&

apiMatch.score.fullTime.away !== null

){

centerContent = `

<div class="scoreBox">

${apiMatch.score.fullTime.home}

-

${apiMatch.score.fullTime.away}

</div>

`;

}

/* اسم البطولة */

let tournamentName =

apiMatch?.competition?.name

||

match.tournament

||

match.group

||

"";

/* استبدال FIFA */

if(

String(tournamentName)
.toLowerCase()
.includes("fifa")

||

String(tournamentName)
.toLowerCase()
.includes("world")

){

tournamentName =
"كأس العالم 2026";

}

/* أسماء الفرق الطويلة */

const team1Class =

isLongTeamName(
match.team1
)

?

"teamName long"

:

"teamName";

const team2Class =

isLongTeamName(
match.team2
)

?

"teamName long"

:

"teamName";

html += `

<div class="matchCard">

<div class="teamsRow">

<div class="team">

<img

class="teamLogo"

src="${match.logo1}"

alt="${match.team1}"

onerror="this.style.display='none'">

<div class="${team1Class}">

${match.team1}

</div>

</div>

<div class="centerBox">

${centerContent}

<div class="tournament">

🏆 ${tournamentName}

</div>

</div>

<div class="team">

<img

class="teamLogo"

src="${match.logo2}"

alt="${match.team2}"

onerror="this.style.display='none'">

<div class="${team2Class}">

${match.team2}

</div>

</div>

</div>

<div class="bottomInfo">

<div class="infoItem">

🎙️

${match.commentator || "غير محدد"}

</div>

<div class="infoItem">

📺

${match.channel || "غير محدد"}

</div>

</div>

<div class="${status.className}">

${status.text}

</div>

</div>

`;

});

if(html === ""){

html = `

<div class="empty">

لا توجد مباريات حالياً

</div>

`;

}

container.innerHTML = html;

}

/* تشغيل أولي */

renderMatches();

/* معالجة الصور التالفة */

document.addEventListener(

"error",

function(e){

if(
e.target.tagName === "IMG"
){

e.target.style.display =
"none";

}

},

true

);

</script>

</body>

</html>
