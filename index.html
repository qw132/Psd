<style>

:root{

--main:#0f7a39;
--main-dark:#0b5f2b;

--bg:#07140c;
--card:#102116;

--text:#ffffff;

--live:#22c55e;
--notstarted:#3b82f6;
--finished:#ef4444;

--shadow:
0 8px 30px rgba(0,0,0,.25);

}

body.light{

--bg:#f5f7f6;
--card:#ffffff;

--text:#121212;

--main:#0f7a39;
--main-dark:#0b5f2b;

}

*{

margin:0;
padding:0;

box-sizing:border-box;

font-family:'Cairo',sans-serif;

}

body{

background:var(--bg);

color:var(--text);

min-height:100vh;

transition:.3s;

}

body::before{

content:"";

position:fixed;

inset:0;

background:url("Screenshot_٢٠٢٦٠٦١٩-٠٣٣٠٤٥.png")
center center no-repeat;

background-size:cover;

opacity:.08;

z-index:-2;

pointer-events:none;

}

body::after{

content:"";

position:fixed;

inset:0;

background:
linear-gradient(
180deg,
rgba(0,0,0,.10),
rgba(0,0,0,.45)
);

z-index:-1;

}

header{

position:fixed;

top:0;
right:0;
left:0;

z-index:1000;

background:
rgba(15,122,57,.95);

backdrop-filter:blur(12px);

padding:14px;

box-shadow:var(--shadow);

}

.logo{

width:70%;

max-width:500px;

display:block;

margin:auto;

object-fit:contain;

}

.developerBar{

position:fixed;

top:90px;

right:0;
left:0;

z-index:999;

background:
rgba(255,255,255,.05);

backdrop-filter:blur(10px);

padding:10px;

display:flex;

justify-content:center;
align-items:center;

gap:15px;

font-size:15px;

font-weight:700;

}

.themeBtn{

border:none;

background:white;

color:#111;

padding:8px 14px;

border-radius:12px;

cursor:pointer;

font-weight:700;

}

.filterBar{

position:fixed;

top:142px;

right:0;
left:0;

z-index:998;

display:flex;

justify-content:center;

gap:10px;

padding:10px;

background:
rgba(0,0,0,.12);

backdrop-filter:blur(10px);

}

.filterBtn{

border:none;

color:white;

font-weight:800;

padding:10px 16px;

border-radius:14px;

cursor:pointer;

transition:.25s;

min-width:120px;

}

.filterBtn.active{

outline:3px solid #fff;

transform:scale(1.05);

}

.liveBtn{

background:var(--live);

}

.notstartedBtn{

background:var(--notstarted);

}

.finishedBtn{

background:var(--finished);

}

.container{

max-width:850px;

margin:auto;

padding:220px 12px 20px;

}
  .matchCard{

background:var(--card);

border-radius:24px;

padding:18px;

margin-bottom:16px;

box-shadow:var(--shadow);

border:1px solid
rgba(255,255,255,.08);

transition:.25s;

overflow:hidden;

}

.matchCard:hover{

transform:translateY(-3px);

}

.cardTop{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:14px;

}

.groupBadge{

background:
rgba(255,255,255,.08);

padding:6px 12px;

border-radius:12px;

font-size:13px;

font-weight:700;

}

.dayBadge{

background:
rgba(255,255,255,.08);

padding:6px 12px;

border-radius:12px;

font-size:13px;

font-weight:700;

}

.teamsRow{

display:flex;

justify-content:space-between;

align-items:center;

gap:10px;

}

.teamBox{

width:32%;

text-align:center;

}

.teamLogo{

width:80px;

height:80px;

object-fit:contain;

display:block;

margin:auto;

}

.teamName{

margin-top:8px;

font-size:17px;

font-weight:800;

}

.matchCenter{

width:36%;

text-align:center;

}

.matchTime{

background:
rgba(255,255,255,.08);

border-radius:18px;

padding:12px;

font-size:22px;

font-weight:800;

}

.matchScore{

font-size:34px;

font-weight:900;

color:var(--main);

margin-bottom:10px;

}

.extraRow{

display:flex;

gap:10px;

margin-top:16px;

}

.extraBox{

flex:1;

background:
rgba(255,255,255,.06);

padding:10px;

border-radius:14px;

text-align:center;

font-size:14px;

font-weight:700;

}

.statusBar{

margin-top:14px;

padding:10px;

border-radius:14px;

text-align:center;

font-weight:800;

color:white;

}

.statusLive{

background:var(--live);

}

.statusNotStarted{

background:var(--notstarted);

}

.statusFinished{

background:var(--finished);

}

.emptyState{

background:var(--card);

padding:25px;

border-radius:20px;

text-align:center;

font-size:18px;

font-weight:800;

box-shadow:var(--shadow);

}

footer{

margin-top:20px;

padding:20px;

text-align:center;

background:var(--main);

}

.support{

display:inline-block;

margin-top:12px;

padding:10px 20px;

background:#25D366;

color:white;

text-decoration:none;

border-radius:20px;

font-weight:700;

}

</style>

</head>

<body>

<header>

<img
src="file_00000000d0f871f4b728f73dff260688_1 (1).png"
class="logo"
alt="ماتشات">

</header>

<div class="developerBar">

<span>
المطور : Mohamed Hosny Hora
</span>

<button
id="themeBtn"
class="themeBtn">

☀️ فاتح

</button>

</div>

<div class="filterBar">

<button
class="filterBtn finishedBtn">

انتهت (0)

</button>

<button
class="filterBtn liveBtn active">

جارية الآن (0)

</button>

<button
class="filterBtn notstartedBtn">

لم تبدأ (0)

</button>

</div>

<div
id="matches"
class="container">
  <div class="emptyState">

جاري تحميل المباريات...

</div>

</div>

<footer>

<div>

جميع الحقوق محفوظة 2026 ®

</div>

<a
class="support"
href="https://wa.me/201040507023"
target="_blank">

الدعم

</a>

</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,

collection,

onSnapshot

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:
"AIzaSyCDoHtDphHNZoZfCV2pXqJ3LD8JzzXSHFw",

authDomain:
"match3t.firebaseapp.com",

projectId:
"match3t",

storageBucket:
"match3t.firebasestorage.app",

messagingSenderId:
"966340184804",

appId:
"1:966340184804:web:aedda5fac457d0907e3af1"

};

const app =
initializeApp(
firebaseConfig
);

const db =
getFirestore(app);

let matchesData = [];

let apiMatches = [];

let currentFilter =
"live";

/* الوضع الفاتح والداكن */

const themeBtn =
document.getElementById(
"themeBtn"
);

const savedTheme =
localStorage.getItem(
"theme"
);

if(savedTheme === "light"){

document.body.classList.add(
"light"
);

themeBtn.innerHTML =
"🌙 داكن";

}

themeBtn.addEventListener(
"click",
()=>{

document.body.classList.toggle(
"light"
);

const isLight =
document.body.classList.contains(
"light"
);

if(isLight){

localStorage.setItem(
"theme",
"light"
);

themeBtn.innerHTML =
"🌙 داكن";

}else{

localStorage.setItem(
"theme",
"dark"
);

themeBtn.innerHTML =
"☀️ فاتح";

}

}
);

/* الفلاتر */

function setFilter(filter){

currentFilter =
filter;

document
.querySelectorAll(
".filterBtn"
)
.forEach(btn=>{

btn.classList.remove(
"active"
);

});

if(filter==="live"){

document
.querySelector(
".liveBtn"
)
.classList.add(
"active"
);

}

if(filter==="notstarted"){

document
.querySelector(
".notstartedBtn"
)
.classList.add(
"active"
);

}

if(filter==="finished"){

document
.querySelector(
".finishedBtn"
)
.classList.add(
"active"
);

}

renderMatches();

}

document
.querySelector(".liveBtn")
.addEventListener(
"click",
()=>setFilter("live")
);

document
.querySelector(".notstartedBtn")
.addEventListener(
"click",
()=>setFilter("notstarted")
);

document
.querySelector(".finishedBtn")
.addEventListener(
"click",
()=>setFilter("finished")
);
  /* العدادات */

function updateCounters(){

let liveCount = 0;

let notStartedCount = 0;

let finishedCount = 0;

matchesData.forEach(match=>{

const apiMatch =
apiMatches.find(
m =>
String(m.id) ===
String(match.eventId)
);

if(!apiMatch){

notStartedCount++;

return;

}

if(

apiMatch.status === "IN_PLAY"

||

apiMatch.status === "PAUSED"

||

apiMatch.status === "LIVE"

){

liveCount++;

return;

}

if(
apiMatch.status === "TIMED"
){

notStartedCount++;

return;

}

if(
apiMatch.status === "FINISHED"
){

finishedCount++;

return;

}

});

document.querySelector(
".liveBtn"
).innerHTML =
`جارية الآن (${liveCount})`;

document.querySelector(
".notstartedBtn"
).innerHTML =
`لم تبدأ (${notStartedCount})`;

document.querySelector(
".finishedBtn"
).innerHTML =
`انتهت (${finishedCount})`;

}

/* التاريخ */

function formatDateForUser(dateString){

const egyptNow = new Date(

new Date().toLocaleString(
"en-US",
{
timeZone:"Africa/Cairo"
}
)

);

const matchDate =
new Date(dateString);

const today =
new Date(egyptNow);

const tomorrow =
new Date(egyptNow);

tomorrow.setDate(
today.getDate() + 1
);

const yesterday =
new Date(egyptNow);

yesterday.setDate(
today.getDate() - 1
);

/* بداية اليوم الجديد 4:30 صباحاً */

const currentMinutes =

(egyptNow.getHours() * 60)

+

egyptNow.getMinutes();

if(currentMinutes < 270){

today.setDate(
today.getDate() - 1
);

tomorrow.setDate(
today.getDate() + 1
);

}

if(

matchDate.getFullYear() ===
today.getFullYear()

&&

matchDate.getMonth() ===
today.getMonth()

&&

matchDate.getDate() ===
today.getDate()

){

return "اليوم";

}

if(

matchDate.getFullYear() ===
tomorrow.getFullYear()

&&

matchDate.getMonth() ===
tomorrow.getMonth()

&&

matchDate.getDate() ===
tomorrow.getDate()

){

return "غداً";

}

if(

matchDate.getFullYear() ===
yesterday.getFullYear()

&&

matchDate.getMonth() ===
yesterday.getMonth()

&&

matchDate.getDate() ===
yesterday.getDate()

){

return "أمس";

}

return dateString;

}

function formatTime12(timeString){

let [hours,minutes] =
timeString.split(":");

hours = parseInt(hours);

let period = "AM";

if(hours >= 12){

period = "PM";

}

hours = hours % 12;

if(hours === 0){

hours = 12;

}

return hours + ":" + minutes + " " + period;

}

function getStatus(status){

if(

status === "IN_PLAY"

||

status === "PAUSED"

||

status === "LIVE"

){

return{

text:"جارية الآن",

className:"live",

statusClass:"statusLive"

};

}

if(status === "TIMED"){

return{

text:"لم تبدأ",

className:"notstarted",

statusClass:"statusNotStarted"

};

}

if(status === "FINISHED"){

return{

text:"انتهت",

className:"finished",

statusClass:"statusFinished"

};

}

return{

text:"لم تبدأ",

className:"notstarted",

statusClass:"statusNotStarted"

};

  }
  /* ترتيب المباريات */

function sortMatches(){

matchesData.sort((a,b)=>{

const matchA =
apiMatches.find(
m =>
String(m.id) ===
String(a.eventId)
);

const matchB =
apiMatches.find(
m =>
String(m.id) ===
String(b.eventId)
);

function getOrder(match){

if(

match?.status === "IN_PLAY"

||

match?.status === "PAUSED"

||

match?.status === "LIVE"

){

return 1;

}

if(
match?.status === "TIMED"
){

return 2;

}

if(
match?.status === "FINISHED"
){

return 3;

}

return 4;

}

const orderA =
getOrder(matchA);

const orderB =
getOrder(matchB);

if(orderA !== orderB){

return orderA - orderB;

}

/* الأقرب وقتاً */

const dateA =
new Date(
`${a.date} ${a.time}`
);

const dateB =
new Date(
`${b.date} ${b.time}`
);

return dateA - dateB;

});

}

/* جلب البيانات */

async function loadApiMatches(){

try{

const response =
await fetch(
"/api/matches"
);

const data =
await response.json();

apiMatches =
data.matches || [];

updateCounters();

sortMatches();

renderMatches();

}
catch(error){

console.log(
"API Error:",
error
);

}

}

/* مراقبة فايربيز */

onSnapshot(

collection(
db,
"matches"
),

(snapshot)=>{

matchesData = [];

snapshot.forEach(doc=>{

matchesData.push({

id:doc.id,

...doc.data()

});

});

sortMatches();

updateCounters();

renderMatches();

}

);

/* تحديث أولي */

loadApiMatches();

/* تحديث مباشر */

setInterval(

()=>{

loadApiMatches();

},

30000

);
  /* رسم المباريات */

function renderMatches(){

const container =
document.getElementById(
"matches"
);

let html = "";

matchesData.forEach(match=>{

const apiMatch =
apiMatches.find(
m =>
String(m.id) ===
String(match.eventId)
);

let status = {

text:"لم تبدأ",

className:"notstarted",

statusClass:"statusNotStarted"

};

if(apiMatch){

status =
getStatus(
apiMatch.status
);

}

/* الفلترة */

if(
currentFilter !==
status.className
){
return;
}

/* الوقت أو النتيجة */

let centerContent = `

<div class="matchTime">

${formatTime12(
match.time
)}

</div>

`;

if(

apiMatch

&&

apiMatch.score

&&

apiMatch.score.fullTime

&&

apiMatch.score.fullTime.home !== null

){

centerContent = `

<div class="matchScore">

${apiMatch.score.fullTime.home}

-

${apiMatch.score.fullTime.away}

</div>

`;

}

const groupName =

apiMatch?.group

?

apiMatch.group.replace(
"_",
" "
)

:

(match.group || "");

html += `

<div class="matchCard">

<div class="cardTop">

<div class="groupBadge">

${groupName}

</div>

<div class="dayBadge">

${formatDateForUser(
match.date
)}

</div>

</div>

<div class="teamsRow">

<div class="teamBox">

<img
class="teamLogo"
src="${match.logo1}"
alt="${match.team1}"
onerror="this.style.display='none'">

<div class="teamName">

${match.team1}

</div>

</div>

<div class="matchCenter">

${centerContent}

</div>

<div class="teamBox">

<img
class="teamLogo"
src="${match.logo2}"
alt="${match.team2}"
onerror="this.style.display='none'">

<div class="teamName">

${match.team2}

</div>

</div>

</div>

<div class="extraRow">

<div class="extraBox">

📺

${match.channel || "غير محدد"}

</div>

<div class="extraBox">

🎙️

${match.commentator || "غير محدد"}

</div>

</div>

<div class="statusBar ${status.statusClass}">

${status.text}

</div>

</div>

`;

});

if(html === ""){

html = `

<div class="emptyState">

لا توجد مباريات في هذا القسم حالياً

</div>

`;

}

container.innerHTML = html;

}

/* أول رسم */

renderMatches();

</script>

</body>

</html>
