<script type="module">
  
  import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
onSnapshot,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  /* Firebase */

const firebaseConfig = {

apiKey:
"AIzaSyCDoHtDphHNZoZfCV2pXqJ3LD8JzzXSHFw",

authDomain:
"match3t.firebaseapp.com",

projectId:
"match3t",

storageBucket:
"match3t.firebasestorage.app",

messagingSenderId:
"966340184804",

appId:
"1:966340184804:web:aedda5fac457d0907e3af1"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* متغيرات */

let matchesData = [];

let apiMatches = [];

let searchText = "";

let liveStreams = [];

/* البحث */

const searchBtn =
document.getElementById(
"searchBtn"
);

const searchBar =
document.getElementById(
"searchBar"
);

const searchInput =
document.getElementById(
"searchInput"
);

searchBtn.addEventListener(
"click",
()=>{

searchBar.classList.toggle(
"active"
);

if(
searchBar.classList.contains(
"active"
)
){

searchInput.focus();

}

}
);

searchInput.addEventListener(
"input",
e=>{

searchText =
e.target.value
.trim()
.toLowerCase();

renderMatches();

}
);

/* الوقت */

function formatTime12(timeString){

let [hours,minutes] =
timeString.split(":");

hours =
parseInt(hours);

let period = "AM";

if(hours >= 12){

period = "PM";

}

hours =
hours % 12;

if(hours === 0){

hours = 12;

}

return `${hours}:${minutes} ${period}`;

}

/* الحالة */

function getMatchStatus(status){

function translateStage(stage){

if(!stage) return "";

const stages = {

"GROU_STAGE":"دور المجموعات",

"LAST_32":"دور الـ32",

"LAST_16":"دور الـ16",

"QUARTER_FINALS":"ربع النهائي",

"SEMI_FINALS":"نصف النهائي",

"FINAL":"النهائي"

};

return stages[stage] || stage;

   }
  
if(

status === "IN_PLAY"

||

status === "PAUSED"

||

status === "LIVE"

){

return{

text:"جارية الآن",

className:
"liveBadge",

order:1

};

}

if(
status === "TIMED"
){

return{

text:"لم تبدأ",

className:
"notStartedBadge",

order:2

};

}

if(
status === "FINISHED"
){

return{

text:"انتهت",

className:
"finishedBadge",

order:3

};

}

return{

text:"لم تبدأ",

className:
"notStartedBadge",

order:2

};

}


  
/* فلترة البحث */

function matchSearch(match){

if(searchText === ""){

return true;

}

const team1 =
(match.team1 || "")
.toLowerCase();

const team2 =
(match.team2 || "")
.toLowerCase();

return (

team1.includes(searchText)

||

team2.includes(searchText)

);

  }
  /* ترتيب المباريات */

function sortMatches(){

matchesData.sort((a,b)=>{

const apiA =
apiMatches.find(
m =>
String(m.id) ===
String(a.eventId)
);

const apiB =
apiMatches.find(
m =>
String(m.id) ===
String(b.eventId)
);

const statusA =
getMatchStatus(
apiA?.status
).order;

const statusB =
getMatchStatus(
apiB?.status
).order;

if(statusA !== statusB){

return statusA - statusB;

}

/* الأقرب وقتاً */

const dateA =
new Date(
`${a.date} ${a.time}`
);

const dateB =
new Date(
`${b.date} ${b.time}`
);

return dateA - dateB;

});

}

/* جلب المباريات */

async function loadApiMatches(){

try{

const response =
await fetch(
"/api/matches"
);

const data =
await response.json();

apiMatches =
data.matches || [];

/* ترتيب */

sortMatches();

/* عرض */

renderMatches();

}
catch(error){

console.log(
"API ERROR",
error
);

}

}

/* Firebase realtime */

onSnapshot(

collection(
db,
"matches"
),

(snapshot)=>{

matchesData = [];

snapshot.forEach(doc=>{

matchesData.push({

id:doc.id,

...doc.data()

});

});

sortMatches();

renderMatches();

}

);

onSnapshot(

collection(db,"liveStreams"),

(snapshot)=>{

liveStreams = [];

snapshot.forEach(doc=>{

liveStreams.push({

id:doc.id,

...doc.data()

});

});

renderLiveCards();

}

);

/* أول تحميل */

loadApiMatches();

/* تحديث مستمر */

setInterval(

()=>{

loadApiMatches();

},

30000

);

/* حذف المباريات المنتهية بعد 8 ساعات */

function shouldHideFinishedMatch(apiMatch){

if(
apiMatch?.status !==
"FINISHED"
){

return false;

}

const finishedTime =

apiMatch.finishedAt ||

apiMatch.lastUpdated ||

null;

if(!finishedTime){

return false;

}

const finishDate =
new Date(
finishedTime
);

const now =
new Date();

const hoursPassed =

(
now - finishDate
)

/

1000

/

60

/

60;

return hoursPassed >= 8;

  }
  /* رسم المباريات */

function renderMatches(){

const container =
document.getElementById(
"matches"
);

let html = "";

matchesData.forEach(match=>{

const apiMatch =
apiMatches.find(
m =>
String(m.id) ===
String(match.eventId)
);

/* البحث */

if(
!matchSearch(match)
){

return;

}

/* إخفاء المنتهية بعد 8 ساعات */

if(
shouldHideFinishedMatch(
apiMatch
)
){

return;

}

const status =
getMatchStatus(
apiMatch?.status
);

/* الوقت أو النتيجة */

let centerContent = `

<div class="timeBox">

${formatTime12(
match.time
)}

</div>

`;

if(

apiMatch?.score

&&

apiMatch.score.fullTime

&&

apiMatch.score.fullTime.home !== null

){

centerContent = `

<div class="scoreBox">

${apiMatch.score.fullTime.home}

-

${apiMatch.score.fullTime.away}

</div>

`;

}

/* البطولة */

const tournamentName =

apiMatch?.competition?.name

||

match.tournament

||

match.group

||

"";

html += `

<div class="matchCard">

<div class="teamsRow">

<div class="team">

<img

class="teamLogo"

src="${match.logo1}"

alt="${match.team1}"

onerror="this.style.display='none'">

<div class="teamName">

${match.team1}

</div>

</div>

<div class="centerBox">

${centerContent}

<div class="tournament">

🏆 كأس العالم

</div>

<div style="
display:flex;
justify-content:center;
margin-top:8px;
">

<div style="
background:linear-gradient(180deg,#0d6efd,#0a58ca);
color:#fff;
padding:6px 16px;
border-radius:999px;
font-size:13px;
font-weight:800;
">

🏆 ${translateStage(match.group)}

</div>

</div>

</div>

<div class="team">

<img

class="teamLogo"

src="${match.logo2}"

alt="${match.team2}"

onerror="this.style.display='none'">

<div class="teamName">

${match.team2}

</div>

</div>

</div>

<div class="bottomInfo">

<div class="infoItem">

🎙️

${match.commentator || "غير محدد"}

</div>

<div class="infoItem">

📺

${match.channel || "غير محدد"}

</div>

</div>

<div class="${status.className}">

${status.text}

</div>

</div>

`;

});

if(html === ""){

html = `

<div class="empty">

لا توجد مباريات حالياً

</div>

`;

}

container.innerHTML = html;

  }
  /* تحميل أولي */

renderMatches();

/* تحديث مباشر */

setInterval(()=>{

loadApiMatches();

},30000);

/* معالجة الصور التالفة */

document.addEventListener(

"error",

function(e){

if(
e.target.tagName === "IMG"
){

e.target.style.display =
"none";

}

},

true

);

/* =========================
Bottom Navigation
========================= */

const liveBtn = document.getElementById("liveBtn");
const channelsBtn = document.getElementById("channelsBtn");
const matchesPage = document.getElementById("eventsPage");
const channelsPage = document.getElementById("channelsPage");

if(liveBtn && channelsBtn && matchesPage && channelsPage){

liveBtn.onclick = ()=>{

liveBtn.classList.add("active");
channelsBtn.classList.remove("active");

matchesPage.style.display = "block";
channelsPage.style.display = "none";

};

channelsBtn.onclick = ()=>{

channelsBtn.classList.add("active");
liveBtn.classList.remove("active");

matchesPage.style.display = "none";
channelsPage.style.display = "block";

};

  }
  
liveBtn.onclick = ()=>{

liveBtn.classList.add("active");

channelsBtn.classList.remove("active");

matchesPage.style.display = "block";

channelsPage.style.display = "none";

};

function renderLiveCards(){

const liveCards = document.getElementById("liveCards");

if(!liveCards) return;

liveCards.innerHTML = "";

if(liveStreams.length === 0){

return;

}

liveStreams.forEach(stream=>{

if(stream.enabled !== true) return;

const match = matchesData.find(
m => String(m.eventId) === String(stream.eventId)
);

const apiMatch = apiMatches.find(
    m => String(m.id) === String(stream.eventId)
);

const status = getMatchStatus(apiMatch?.status);
  
if(!match) return;

liveCards.innerHTML += `

<div class="channelCard"

onclick="window.location.href='${stream.pageUrl}'"

style="
background-image:url('${stream.imageUrl}');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
min-height:180px;
display:flex;
align-items:flex-end;
padding:20px;
">

<div style="
width:100%;
background:rgba(0,0,0,.55);
border-radius:14px;
padding:12px;
color:#fff;
font-weight:700;
text-align:center;
">

<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">

<div style="width:35%;text-align:center;">
<div style="font-size:16px;font-weight:800;">
${match.team1}
</div>
</div>

<div style="width:45%;text-align:center;">
<div class="${status.className}" style="margin:0;">
${status.text}
</div>
</div>

<div style="width:35%;text-align:center;">
<div style="font-size:16px;font-weight:800;">
${match.team2}
</div>
</div>
<<div style="
display:flex;
justify-content:center;
margin-top:12px;
">

<div style="
background:linear-gradient(180deg,#0d6efd,#0a58ca);
color:#fff;
padding:6px 16px;
border-radius:999px;
font-size:13px;
font-weight:800;
">

🏆 ${translateStage(match.group)}

</div>

</div>
</div>

</div>

</div>

`;

});
  }
  
</script>
