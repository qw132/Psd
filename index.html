.match{

font-weight:bold;
}

.match-day{
margin-top:10px;
font-size:16px;
font-weight:bold;
color:#555;
}

.score{
font-size:28px;
font-weight:bold;
color:#0f7a39;
margin-top:8px;
}

.status{
margin-top:10px;
padding:10px;
border-radius:10px;
text-align:center;
font-weight:bold;
color:white;
}

.notstarted{
background:#007bff;
}

.live{
background:#28a745;
}

.finished{

}

footer{
background:#0f7a39;
padding:20px;
text-align:center;
margin-top:20px;
}

.support{

margin-top:15px;
