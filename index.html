<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MH M3ch</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#0f5f2c;
color:white;
min-height:100vh;
position:relative;
}

body::before{
content:"";
position:fixed;
inset:0;
background:url("Screenshot_٢٠٢٦٠٦١٩-٠٣٣٠٤٥.png") center center no-repeat;
background-size:cover;
opacity:.18;
z-index:-2;
}

body::after{
content:"";
position:fixed;
inset:0;
background:rgba(0,70,20,.78);
z-index:-1;
}

header{
background:#0f7a39;
padding:20px;
text-align:center;
font-size:42px;
font-weight:bold;
position:sticky;
top:0;
z-index:100;
}

.developer{
text-align:center;
padding:12px;
font-size:18px;
font-weight:bold;
background:rgba(255,255,255,.08);
backdrop-filter:blur(5px);
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.match{
background:white;
color:#222;
padding:20px;
border-radius:18px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.team{
width:35%;
text-align:center;
}

.team img{
width:90px;
height:90px;
object-fit:contain;
}

.center{
width:30%;
text-align:center;
}

.status{
margin-top:10px;
padding:10px;
border-radius:10px;
font-weight:bold;
color:white;
}

.notstarted{
background:#007bff;
}

.live{
background:#28a745;
}

.finished{
background:#dc3545;
}

.support{
position:fixed;
top:15px;
left:15px;
background:#25D366;
color:white;
padding:12px 20px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
z-index:999;
}

footer{
background:#0f7a39;
padding:15px;
text-align:center;
margin-top:25px;
}
</style>
</head>

<body>

<a
class="support"
href="https://wa.me/201040507023"
target="_blank">
الدعم
</a>

<header>
MH M3ch
</header>

<div class="developer">
Mohamed Hosny Hora
</div>

<div id="matches" class="container"></div>

<footer>
جميع الحقوق محفوظة Mohamed Hosny Hora 2026 ®
</footer>

<script>

function getCairoNow(){

return new Date(
new Date().toLocaleString(
'en-US',
{timeZone:'Africa/Cairo'}
)
);

}

function getStatus(datetime){

const now = getCairoNow();

const start = new Date(datetime);

const end = new Date(
start.getTime() + 7200000
);

if(now < start){

return{
text:"لم تبدأ",
className:"notstarted"
};

}

if(now >= start && now <= end){

return{
text:"جارية الآن",
className:"live"
};

}

return{
text:"انتهت",
className:"finished"
};

}

function loadMatches(){

const matches =
JSON.parse(
localStorage.getItem("matches")
) || [];

let html="";

matches.forEach(match=>{

const status =
getStatus(match.datetime);

html += `
<div class="match">

<div class="team">
<img src="${match.logo1}">
<h3>${match.team1}</h3>
</div>

<div class="center">
<h3>${match.date}</h3>
<p>${match.time}</p>

<div class="status ${status.className}">
${status.text}
</div>
</div>

<div class="team">
<img src="${match.logo2}">
<h3>${match.team2}</h3>
</div>

</div>
`;

});

document.getElementById("matches")
.innerHTML = html;

}

loadMatches();

setInterval(loadMatches,60000);

</script>

</body>
</html>
