<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ماتشات</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#0f5f2c;
color:white;
min-height:100vh;
position:relative;
}

body::before{
content:"";
position:fixed;
inset:0;
background:url("Screenshot_٢٠٢٦٠٦١٩-٠٣٣٠٤٥.png") center center no-repeat;
background-size:cover;
opacity:.18;
z-index:-2;
}

body::after{
content:"";
position:fixed;
inset:0;
background:rgba(0,70,20,.78);
z-index:-1;
}

header{
background:#0f7a39;
padding:20px;
text-align:center;
font-size:42px;
font-weight:bold;
position:sticky;
top:0;
z-index:100;
}

.developer{
text-align:center;
padding:12px;
font-size:18px;
font-weight:bold;
background:rgba(255,255,255,.08);
backdrop-filter:blur(5px);
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.match{
background:#fff;
color:#000;
border-radius:25px;
padding:20px;
margin-bottom:20px;

display:flex;
align-items:center;
justify-content:space-between;

gap:10px;
overflow:hidden;
}

.team{
flex:1;
text-align:center;
}

.team img{
width:90px;
height:90px;
object-fit:contain;
display:block;
margin:auto;
}

.team h3{
margin-top:10px;
font-size:22px;
font-weight:bold;
word-break:break-word;
}

.center{
width:220px;
text-align:center;
}

.match-time{
background:#ececec;
border-radius:35px;
padding:18px 15px;
font-weight:bold;
}

.match-day{
font-size:18px;
color:#555;
margin-bottom:10px;
}

.match-clock{
font-size:38px;
font-weight:bold;
}

.status{
margin-top:12px;
padding:10px;
border-radius:12px;
font-weight:bold;
color:white;
font-size:18px;
}

.notstarted{
background:#007bff;
}

.live{
background:#28a745;
}

.finished{
background:#dc3545;
}

footer{
background:#0f7a39;
padding:20px;
text-align:center;
margin-top:25px;
}

.support{
display:inline-block;
margin-top:15px;
background:#25D366;
color:white;
padding:12px 25px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
}

  </style>
  </head>

<body>

<header>
ماتشات
</header>

<div class="developer">
المطور: Mohamed Hosny Hora
</div>

<div id="matches" class="container"></div>

<footer>

<div>
جميع الحقوق محفوظة Mohamed Hosny Hora 2026 ®
</div>

<a
class="support"
href="https://wa.me/201040507023"
target="_blank">
الدعم
</a>

</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCDoHtDphHNZoZfCV2pXqJ3LD8JzzXSHFw",
authDomain: "match3t.firebaseapp.com",
projectId: "match3t",
storageBucket: "match3t.firebasestorage.app",
messagingSenderId: "966340184804",
appId: "1:966340184804:web:aedda5fac457d0907e3af1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function formatDateForUser(dateString){

const matchDate = new Date(dateString);

const today = new Date();

const tomorrow = new Date();
tomorrow.setDate(today.getDate() + 1);

if(
matchDate.getFullYear() === today.getFullYear() &&
matchDate.getMonth() === today.getMonth() &&
matchDate.getDate() === today.getDate()
){
return "اليوم";
}

if(
matchDate.getFullYear() === tomorrow.getFullYear() &&
matchDate.getMonth() === tomorrow.getMonth() &&
matchDate.getDate() === tomorrow.getDate()
){
return "الليلة";
}

return dateString;

}

function formatTime12(timeString){

let [hours,minutes] = timeString.split(":");

hours = parseInt(hours);

let period = "ص";

if(hours >= 12){
period = "م";
}

hours = hours % 12;

if(hours === 0){
hours = 12;
}

return hours + ":" + minutes + " " + period;

}
  function getStatus(datetime){

const now =
new Date(Date.now() - 3600000);

const start =
new Date(datetime);

const end =
new Date(
start.getTime() + 7200000
);

if(now < start){

return{
text:"لم تبدأ",
className:"notstarted"
};

}

if(now >= start && now <= end){

return{
text:"جارية الآن",
className:"live"
};

}

return{
text:"انتهت",
className:"finished"
};

}

const matchesContainer =
document.getElementById("matches");

onSnapshot(
collection(db,"matches"),
(snapshot)=>{

let html = "";

snapshot.forEach((doc)=>{

const match = doc.data();

const status =
getStatus(match.datetime);

html += `

<div class="match">

<div class="team">

<img
src="${match.logo1}"
alt="${match.team1}"
onerror="this.src='https://via.placeholder.com/90'">

<h3>${match.team1}</h3>

</div>

<div class="center">

<div class="match-time">

<div class="match-day">
${formatDateForUser(match.date)}
</div>

<div class="match-clock">
${formatTime12(match.time)}
</div>

</div>

<div class="status ${status.className}">
${status.text}
</div>

</div>

<div class="team">

<img
src="${match.logo2}"
alt="${match.team2}"
onerror="this.src='https://via.placeholder.com/90'">

<h3>${match.team2}</h3>

</div>

</div>

`;

});

if(html === ""){

html = `

<div class="match">

<div class="center" style="width:100%;text-align:center;">

<h3>
لا توجد مباريات حالياً
</h3>

</div>

</div>

`;

}

matchesContainer.innerHTML = html;

}
);

</script>

</body>
</html>
