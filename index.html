<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GDW3L</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#0b5d1e;
color:white;
min-height:100vh;
position:relative;
overflow-x:hidden;
}

/* الخلفية */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("images.jpeg") center center no-repeat;
background-size:cover;
opacity:.15;
z-index:-2;
}

body::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,70,20,.80);
z-index:-1;
}

/* العنوان */

header{
position:sticky;
top:0;
z-index:100;
background:#0f7a39;
padding:20px;
text-align:center;
font-size:42px;
font-weight:bold;
box-shadow:0 2px 10px rgba(0,0,0,.3);
}

/* المحتوى */

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

/* بطاقة المباراة */

.match{
background:rgba(255,255,255,.95);
color:#222;
border-radius:20px;
padding:20px;
margin-bottom:20px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.team{
width:35%;
text-align:center;
}

.team img{
width:90px;
height:90px;
object-fit:contain;
}

.team h3{
margin-top:10px;
}

.center{
width:30%;
text-align:center;
}

.status{
margin-top:10px;
padding:10px;
border-radius:10px;
font-weight:bold;
color:white;
}

.notstarted{
background:#007bff;
}

.live{
background:#28a745;
}

.finished{
background:#dc3545;
}

/* مربع المطور ثابت */

.developer{
position:fixed;
bottom:20px;
right:20px;
background:white;
color:#0f7a39;
padding:12px 18px;
border-radius:30px;
font-weight:bold;
box-shadow:0 0 15px rgba(0,0,0,.3);
z-index:999;
}

/* الدعم */

.support{
position:fixed;
bottom:20px;
left:20px;
background:#25D366;
color:white;
padding:12px 20px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
box-shadow:0 0 15px rgba(0,0,0,.3);
z-index:999;
}

/* الحقوق */

footer{
background:#0f7a39;
padding:15px;
text-align:center;
margin-top:30px;
}

</style>
</head>

<body>

<header>
GDW3L
</header>

<div class="container" id="matches">

</div>

<div class="developer">
المطور : Mohamed Hosny
</div>

<a
class="support"
href="https://wa.me/201040507023"
target="_blank">
الدعم
</a>

<footer>
جميع الحقوق محفوظة Mohamed Hosny Hora 2026 ®
</footer>

<script>

function getStatus(datetime){

let start = new Date(datetime);

let end = new Date(
start.getTime() + (2 * 60 * 60 * 1000)
);

let now = new Date();

if(now < start){

return {
text:"لم تبدأ",
className:"notstarted"
};

}

if(now >= start && now <= end){

return {
text:"جارية الآن",
className:"live"
};

}

return {
text:"انتهت",
className:"finished"
};

}

function loadMatches(){

let matches =
JSON.parse(localStorage.getItem("matches")) || [];

let html = "";

matches.forEach(match=>{

let status =
getStatus(match.datetime);

html += `

<div class="match">

<div class="team">
<img src="${match.logo1}">
<h3>${match.team1}</h3>
</div>

<div class="center">

<h3>${match.date}</h3>

<p>${match.time}</p>

<div class="status ${status.className}">
${status.text}
</div>

</div>

<div class="team">
<img src="${match.logo2}">
<h3>${match.team2}</h3>
</div>

</div>

`;

});

document.getElementById("matches").innerHTML =
html;

}

loadMatches();

setInterval(loadMatches,60000);

</script>

</body>
</html>
