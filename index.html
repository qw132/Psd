<style>

*{

}

.notstartedBtn{

}

}

.score{

}

.match-group{

}

.match-day{

color:#777;
}

.status{
margin-top:10px;
padding:10px;
border-radius:10px;
text-align:center;
font-weight:bold;
color:white;
}

.notstarted{
background:#007bff;
}

.live{
background:#28a745;
}

.finished{
background:#dc3545;
}

.loading{
background:white;
color:black;
padding:20px;
border-radius:20px;
text-align:center;

}

footer{
background:#0f7a39;

}

.support{
display:inline-block;
margin-top:15px;

background:#25D366;

}

</style>

</head>

<body>

<header>

<img
src="file_00000000d0f871f4b728f73dff260688_1 (1).png"
alt="ماتشات"
class="siteLogo">

</header>

<div class="developer">
المطور: Mohamed Hosny Hora
</div>

  <div class="filterBar">

<button
class="filterBtn finishedBtn"
onclick="setFilter('finished')">
انتهت
</button>

<button
class="filterBtn liveBtn activeFilter"
onclick="setFilter('live')">
جارية الآن
</button>

<button
class="filterBtn notstartedBtn"
onclick="setFilter('notstarted')">
لم تبدأ
</button>

  </div>
  
<div id="matches" class="container">

<div class="loading">
جاري تحميل المباريات...
</div>

</div>

<footer>

<div>
جميع الحقوق محفوظة 2026 ®
</div>

<a
class="support"
href="https://wa.me/201040507023"
target="_blank">
الدعم
</a>

</footer>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCDoHtDphHNZoZfCV2pXqJ3LD8JzzXSHFw",
authDomain: "match3t.firebaseapp.com",
projectId: "match3t",
storageBucket: "match3t.firebasestorage.app",
messagingSenderId: "966340184804",
appId: "1:966340184804:web:aedda5fac457d0907e3af1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let matchesData = [];
let apiMatches = [];

function formatDateForUser(dateString){

const egyptNow = new Date(
new Date().toLocaleString(
"en-US",
{
timeZone:"Africa/Cairo"
}
)
);

const matchDate = new Date(dateString);

const today = new Date(egyptNow);

const tomorrow = new Date(egyptNow);
tomorrow.setDate(today.getDate() + 1);

const yesterday = new Date(egyptNow);
yesterday.setDate(today.getDate() - 1);

/* اعتبار بداية اليوم الجديد الساعة 5 صباحاً */

if(egyptNow.getHours() < 6){

today.setDate(today.getDate() - 1);

tomorrow.setDate(today.getDate() + 1);

}

if(
matchDate.getFullYear() === today.getFullYear() &&
matchDate.getMonth() === today.getMonth() &&
matchDate.getDate() === today.getDate()
){
return "اليوم";
}

if(
matchDate.getFullYear() === tomorrow.getFullYear() &&
matchDate.getMonth() === tomorrow.getMonth() &&
matchDate.getDate() === tomorrow.getDate()
){
return "غداً";
}

if(
matchDate.getFullYear() === yesterday.getFullYear() &&
matchDate.getMonth() === yesterday.getMonth() &&
matchDate.getDate() === yesterday.getDate()
){
return "أمس";
}

return dateString;

}
function formatTime12(timeString){

let [hours,minutes] = timeString.split(":");

hours = parseInt(hours);

let period = "AM";

if(hours >= 12){
period = "PM";
}

hours = hours % 12;

if(hours === 0){
hours = 12;
}

return hours + ":" + minutes + " " + period;

}

function getStatus(status){

if(status === "TIMED"){

return{
text:"لم تبدأ",
className:"notstarted"
};

}

if(
status === "IN_PLAY" ||
status === "PAUSED"  
){

return{
text:"جارية الآن",
className:"live"
};

}

if(
status === "FINISHED"
){

return{
text:"انتهت",
className:"finished"
};

}
  if(
status === "LIVE"
){

return{
text:"جارية الآن",
className:"live"
};

  }

return{
text:"لم تبدأ",
className:"notstarted"
};

}

async function loadApiMatches(){

try{

const response = await fetch(
"/api/matches"
);

const data =
await response.json();

apiMatches =
data.matches || [];

renderMatches();

}
catch(error){

console.log(error);

}

let currentFilter = "live";

function setFilter(filter){

currentFilter = filter;

document
.querySelectorAll(".filterBtn")
.forEach(btn=>{

btn.classList.remove("activeFilter");

});

if(filter==="live"){

document
.querySelector(".liveBtn")
.classList.add("activeFilter");

}

if(filter==="notstarted"){

document
.querySelector(".notstartedBtn")
.classList.add("activeFilter");

}

if(filter==="finished"){

document
.querySelector(".finishedBtn")
.classList.add("activeFilter");

}

renderMatches();

  }  
  
}
function renderMatches(){

const container =
document.getElementById("matches");

let html = "";

matchesData.forEach(match=>{

const apiMatch =
apiMatches.find(
m => String(m.id) === String(match.eventId)
);

let status = {
text:"لم تبدأ",
className:"notstarted"
};

let scoreHtml = `

<div class="match-time">
${formatTime12(match.time)}
</div>

`;

let groupHtml = "";

if(apiMatch){

status =
getStatus(apiMatch.status);

if(
apiMatch.score &&
apiMatch.score.fullTime &&
apiMatch.score.fullTime.home !== null
){

scoreHtml = `

<div class="score">
${apiMatch.score.fullTime.home}
-
${apiMatch.score.fullTime.away}
</div>

`;

}

if(apiMatch.group){

groupHtml = `

<div class="match-group">
${apiMatch.group.replace("_"," ")}
</div>

`;

}

}

html += `

<div class="match">

<div class="match-row">

<div class="team">

<img
src="${match.logo1}"
alt="${match.team1}"
onerror="this.style.display='none'">

<h3>
${match.team1}
</h3>

</div>

<div class="center">

${scoreHtml}

${groupHtml}

<div class="match-day">
${formatDateForUser(match.date)}
</div>

</div>

<div class="team">

<img
src="${match.logo2}"
alt="${match.team2}"
onerror="this.style.display='none'">

<h3>
${match.team2}
</h3>

</div>

</div>

<div class="status ${status.className}">
${status.text}
</div>

</div>

`;

});

if(matchesData.length === 0){

html = `

<div class="loading">
لا توجد مباريات حالياً
</div>

`;

}

container.innerHTML = html;

}

onSnapshot(
collection(db,"matches"),
(snapshot)=>{

matchesData = [];

snapshot.forEach(doc=>{

matchesData.push({
id:doc.id,
...doc.data()
});

});

matchesData.sort((a,b)=>{

const matchA =
apiMatches.find(
m => String(m.id) === String(a.eventId)
);

const matchB =
apiMatches.find(
m => String(m.id) === String(b.eventId)
);

function getOrder(match){

if(
match?.status === "IN_PLAY" ||
match?.status === "PAUSED" ||
match?.status === "LIVE"
){
return 1;
}

if(
match?.status === "TIMED"
){
return 2;
}

if(
match?.status === "FINISHED"
){
return 3;
}

return 4;

}

const orderA =
getOrder(matchA);

const orderB =
getOrder(matchB);

if(orderA !== orderB){

return orderA - orderB;

}

return new Date(a.datetime)
-
new Date(b.datetime);

});

renderMatches();

}
);

loadApiMatches();

setInterval(
loadApiMatches,
30000
);

</script>

</body>
</html>
