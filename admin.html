<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الإدارة</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#0f5f2c;
padding:15px;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:white;
padding:15px;
border-radius:20px;
margin-bottom:15px;
}

h1{
text-align:center;
color:white;
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:12px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:5px;
}

.fetchBtn{
background:#007bff;
color:white;
}

.saveBtn{
background:#28a745;
color:white;
}

.editBtn{
background:#ffc107;
color:black;
margin-top:8px;
}

.deleteBtn{
background:#dc3545;
color:white;
margin-top:8px;
}

.teamPreview{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:10px;
}

.teamPreview img{
width:60px;
height:60px;
object-fit:contain;
}

.matchItem{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:10px;
}

.groupBox{
margin-top:10px;
font-weight:bold;
color:#0f7a39;
}

.statusBox{
margin-top:10px;
font-weight:bold;
color:#007bff;
}

</style>

</head>

<body>

<div class="container">

<h1>
لوحة إدارة ماتشات
</h1>

<div class="card">

<input
id="eventId"
placeholder="معرف المباراة من Football Data">

<button
class="fetchBtn"
id="fetchMatch">
جلب بيانات المباراة
</button>

<div class="teamPreview">

<div>
<img id="logo1">
</div>

<div>
<img id="logo2">
</div>

</div>

<input
id="team1"
placeholder="الفريق الأول">

<input
id="team2"
placeholder="الفريق الثاني">

<input
id="date"
placeholder="التاريخ">

<input
id="time"
placeholder="الوقت">

<input
id="group"
placeholder="GROUP">

<input
id="channel"
placeholder="القناة">

<input
id="commentator"
placeholder="المعلق">

<button
class="saveBtn"
id="saveMatch">
حفظ المباراة
</button>

</div>

<div id="matchesList"></div>

</div>

<script type="module">
  import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCDoHtDphHNZoZfCV2pXqJ3LD8JzzXSHFw",
authDomain: "match3t.firebaseapp.com",
projectId: "match3t",
storageBucket: "match3t.firebasestorage.app",
messagingSenderId: "966340184804",
appId: "1:966340184804:web:aedda5fac457d0907e3af1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let editId = null;

const teamsArabic = {

"Mexico":"المكسيك",
"South Africa":"جنوب أفريقيا",
"South Korea":"كوريا الجنوبية",
"Czechia":"التشيك",

"Canada":"كندا",
"Bosnia and Herzegovina":"البوسنة والهرسك",
"Qatar":"قطر",
"Switzerland":"سويسرا",

"Brazil":"البرازيل",
"Morocco":"المغرب",
"Haiti":"هايتي",
"Scotland":"إسكتلندا",

"United States":"الولايات المتحدة",
"Paraguay":"باراغواي",
"Australia":"أستراليا",
"Turkey":"تركيا",

"Germany":"ألمانيا",
"Curacao":"كوراساو",
"Ivory Coast":"كوت ديفوار",
"Ecuador":"الإكوادور",

"Netherlands":"هولندا",
"Japan":"اليابان",
"Sweden":"السويد",
"Tunisia":"تونس",

"Belgium":"بلجيكا",
"Egypt":"مصر",
"Iran":"إيران",
"New Zealand":"نيوزيلندا",

"Spain":"إسبانيا",
"Cape Verde":"كاب فيردي",
"Saudi Arabia":"السعودية",
"Uruguay":"أوروغواي",

"France":"فرنسا",
"Senegal":"السنغال",
"Iraq":"العراق",
"Norway":"النرويج",

"Argentina":"الأرجنتين",
"Algeria":"الجزائر",
"Austria":"النمسا",
"Jordan":"الأردن",

"Portugal":"البرتغال",
"DR Congo":"الكونغو الديمقراطية",
"Uzbekistan":"أوزبكستان",
"Colombia":"كولومبيا",

"England":"إنجلترا",
"Croatia":"كرواتيا",
"Ghana":"غانا",
"Panama":"بنما"
};

const eventIdInput =
document.getElementById("eventId");

const team1Input =
document.getElementById("team1");

const team2Input =
document.getElementById("team2");

const dateInput =
document.getElementById("date");

const timeInput =
document.getElementById("time");

const groupInput =
document.getElementById("group");

const logo1 =
document.getElementById("logo1");

const logo2 =
document.getElementById("logo2");

document
.getElementById("fetchMatch")
.addEventListener(
"click",
async ()=>{

const eventId =
eventIdInput.value.trim();

if(!eventId){
alert("أدخل معرف المباراة");
return;
}

try{

const response =
await fetch(
`/api/match?id=${eventId}`
);

const data =
await response.json();

const broadcastDoc =
await getDoc(

doc(
db,
"broadcasts",
eventId
)

);

if(
broadcastDoc.exists()
){

const broadcast =
broadcastDoc.data();

channelInput.value =
broadcast.channel || "";

commentatorInput.value =
broadcast.commentator || "";

  }

team1Input.value =
teamsArabic[data.homeTeam.name]
||
data.homeTeam.name;

team2Input.value =
teamsArabic[data.awayTeam.name]
||
data.awayTeam.name;

logo1.src =
data.homeTeam.crest;

logo2.src =
data.awayTeam.crest;

const matchDate =
new Date(data.utcDate);

dateInput.value =
matchDate
.toISOString()
.split("T")[0];

timeInput.value =
matchDate
.toLocaleTimeString(
"ar-EG",
{
hour:"2-digit",
minute:"2-digit"
}
);

groupInput.value =
data.group
?
data.group.replace("_"," ")
:
"";

}
catch(error){

alert(
"فشل جلب بيانات المباراة"
);

console.log(error);

}

});
  document
.getElementById("saveMatch")
.addEventListener(
"click",
async ()=>{

const data = {

eventId:
eventIdInput.value.trim(),

team1:
team1Input.value.trim(),

team2:
team2Input.value.trim(),

logo1:
logo1.src,

logo2:
logo2.src,

date:
dateInput.value,

time:
timeInput.value,

group:
groupInput.value,

datetime:
dateInput.value +
"T" +
timeInput.value

};

try{

if(editId){

await updateDoc(
doc(
db,
"matches",
editId
),
data
);

editId = null;

alert(
"تم تعديل المباراة"
);

}
else{

await addDoc(
collection(
db,
"matches"
),
data
);

alert(
"تم إضافة المباراة"
);

}

eventIdInput.value = "";
team1Input.value = "";
team2Input.value = "";
dateInput.value = "";
timeInput.value = "";
groupInput.value = "";

logo1.src = "";
logo2.src = "";

loadMatches();

}
catch(error){

console.log(error);

alert(
"فشل الحفظ"
);

}

});

async function loadMatches(){

const matchesList =
document.getElementById(
"matchesList"
);

matchesList.innerHTML = "";

const snapshot =
await getDocs(
collection(
db,
"matches"
)
);

snapshot.forEach(docSnap=>{

const match =
docSnap.data();

matchesList.innerHTML += `

<div class="matchItem">

<b>
${match.team1}
-
${match.team2}
</b>

<div class="groupBox">
${match.group || ""}
</div>

<div>
${match.date}
</div>

<div>
${match.time}
</div>

<button
class="editBtn"
onclick="editMatch(
'${docSnap.id}'
)">
تعديل
</button>

<button
class="deleteBtn"
onclick="deleteMatch(
'${docSnap.id}'
)">
حذف
</button>

</div>

`;

});

}

window.editMatch =
async function(id){

const snapshot =
await getDocs(
collection(
db,
"matches"
)
);

snapshot.forEach(docSnap=>{

if(docSnap.id === id){

const match =
docSnap.data();

editId = id;

eventIdInput.value =
match.eventId || "";

team1Input.value =
match.team1 || "";

team2Input.value =
match.team2 || "";

dateInput.value =
match.date || "";

timeInput.value =
match.time || "";

groupInput.value =
match.group || "";

logo1.src =
match.logo1 || "";

logo2.src =
match.logo2 || "";

}

});

};

window.deleteMatch =
async function(id){

if(
!confirm(
"حذف المباراة؟"
)
){
return;
}

await deleteDoc(
doc(
db,
"matches",
id
)
);

loadMatches();

};

loadMatches();

</script>

</body>
</html>
