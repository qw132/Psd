<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>لوحة الإدارة</title>

<style>

body{
background:#f3f3f3;
font-family:Tahoma;
padding:20px;
}

.box{
max-width:700px;
margin:auto;
background:white;
padding:20px;
border-radius:20px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
}

button{
width:100%;
padding:12px;
border:none;
background:#0f7b31;
color:white;
cursor:pointer;
}

.match{
border:1px solid #ddd;
padding:10px;
margin-top:10px;
border-radius:10px;
}

.delete{
background:red;
margin-top:10px;
}

</style>
</head>

<body>

<div class="box" id="loginBox">

<h2>تسجيل الدخول</h2>

<input
type="password"
id="password"
placeholder="كلمة المرور">

<button onclick="login()">
دخول
</button>

</div>

<div
class="box"
id="panel"
style="display:none">

<h2>إضافة مباراة</h2>

<input id="team1" placeholder="الفريق الأول">

<input type="file"
id="logo1"
accept="image/*">

<input id="team2" placeholder="الفريق الثاني">

<input type="file"
id="logo2"
accept="image/*">

<input type="date" id="date">

<input type="time" id="time">

<button onclick="saveMatch()">
حفظ المباراة
</button>

<hr>

<div id="list"></div>

</div>

<script>

const PASSWORD="010405070230";

function login(){

let pass=
document.getElementById("password").value;

if(pass===PASSWORD){

document.getElementById("loginBox").style.display="none";

document.getElementById("panel").style.display="block";

showMatches();

}else{

alert("كلمة المرور غير صحيحة");

}

}

function fileToBase64(file){

return new Promise((resolve,reject)=>{

let reader=new FileReader();

reader.onload=()=>resolve(reader.result);

reader.onerror=()=>reject();

reader.readAsDataURL(file);

});

}

async function saveMatch(){

let team1=
document.getElementById("team1").value;

let team2=
document.getElementById("team2").value;

let logo1File=
document.getElementById("logo1").files[0];

let logo2File=
document.getElementById("logo2").files[0];

let date=
document.getElementById("date").value;

let time=
document.getElementById("time").value;

if(
!team1||
!team2||
!logo1File||
!logo2File||
!date||
!time
){
alert("أكمل جميع البيانات");
return;
}

let logo1=
await fileToBase64(logo1File);

let logo2=
await fileToBase64(logo2File);

let matches=
JSON.parse(localStorage.getItem("matches"))||[];

matches.push({
team1,
team2,
logo1,
logo2,
date,
time,
datetime:date+"T"+time
});

localStorage.setItem(
"matches",
JSON.stringify(matches)
);

alert("تم حفظ المباراة");

showMatches();

}

function showMatches(){

let matches=
JSON.parse(localStorage.getItem("matches"))||[];

let html="";

matches.forEach((m,index)=>{

html+=`

<div class="match">

<b>${m.team1}</b>
×

<b>${m.team2}</b>

<button
class="delete"
onclick="deleteMatch(${index})">

حذف

</button>

</div>

`;

});

document.getElementById("list").innerHTML=html;

}

function deleteMatch(index){

let matches=
JSON.parse(localStorage.getItem("matches"))||[];

matches.splice(index,1);

localStorage.setItem(
"matches",
JSON.stringify(matches)
);

showMatches();

}

</script>

</body>
</html>
