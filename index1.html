<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ماتشات</title>

<style>

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma;
}

body{
background:#0d0d0d;
min-height:100vh;
color:#fff;
}

/* ================= HEADER ================= */

.header{
position:fixed;
top:0;
right:0;
left:0;
height:65px;
background:#141414;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
z-index:999;
}

/* ================= PAGES ================= */

.page{
display:none;
padding:80px 12px 80px;
}

.page.active{
display:block;
}

/* ================= MATCHES ================= */

.matchesContainer{
display:flex;
flex-direction:column;
gap:12px;
}

.matchCard{
background:#fff;
border-radius:18px;
padding:16px;
color:#111;
box-shadow:0 5px 18px rgba(0,0,0,.25);
font-weight:800;
}

/* ================= PACKAGES ================= */

.packagesContainer{
display:flex;
flex-direction:column;
gap:15px;
}

.packageCard{
width:100%;
background:#fff;
padding:22px;
border-radius:20px;
text-align:center;
font-size:18px;
font-weight:800;
color:#111;
cursor:pointer;
box-shadow:0 5px 18px rgba(0,0,0,.25);
}

/* ================= CHANNELS ================= */

.channelsContainer{
display:flex;
flex-direction:column;
gap:12px;
}

.channelCard{
width:100%;
background:linear-gradient(180deg,#fff,#d9d9d9);
padding:20px;
border-radius:18px;
text-align:center;
font-size:18px;
font-weight:800;
color:#111;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,.25);
}

/* ================= PLAYER ================= */

.player{
position:fixed;
top:0;
right:0;
left:0;
bottom:0;
background:#000;
display:none;
z-index:1000;
}

.player video{
width:100%;
height:100%;
}

.backBtn{
position:absolute;
top:15px;
right:15px;
background:#fff;
padding:10px 14px;
border-radius:10px;
font-weight:800;
color:#111;
cursor:pointer;
}

/* ================= BOTTOM BAR ================= */

.bottomBar{
position:fixed;
bottom:0;
right:0;
left:0;
height:55px;
background:#111;
display:flex;
z-index:999;
}

.bottomBtn{
flex:1;
display:flex;
align-items:center;
justify-content:center;
color:#aaa;
font-weight:700;
cursor:pointer;
}

.bottomBtn.active{
background:rgba(255,255,255,.08);
color:#fff;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
MATCHS
</div>

<!-- ================= HOME ================= -->
<div id="home" class="page active">

<div class="packagesContainer">

<div class="packageCard" onclick="openAlkass()">
Alkass Channels
</div>

</div>

<div class="matchesContainer"></div>

</div>

<!-- ================= CHANNELS ================= -->
<div id="channels" class="page">

<div class="channelsContainer"></div>

</div>

<!-- ================= PLAYER ================= -->
<div class="player" id="player">

<div class="backBtn" onclick="closePlayer()">رجوع</div>

<video id="video" controls autoplay></video>

</div>

<!-- ================= BOTTOM BAR ================= -->
<div class="bottomBar">

<div class="bottomBtn active" onclick="showHome()">
Live Events
</div>

<div class="bottomBtn" onclick="showChannels()">
Channels
</div>

</div>

<script>

/* ================= NAVIGATION ================= */

function showHome(){

document.getElementById("home").classList.add("active");
document.getElementById("channels").classList.remove("active");

}

function showChannels(){

document.getElementById("home").classList.remove("active");
document.getElementById("channels").classList.add("active");

}

function openAlkass(){
showChannels();
loadAlkassChannels();
}

function closePlayer(){
document.getElementById("player").style.display="none";
document.getElementById("video").pause();
}

/* ================= ALKASS CHANNELS ================= */

const alkassChannels = [

{name:"Alkass One",url:"https://liveak.alkass.net/live/alkass1/playlist.m3u8"},
{name:"Alkass Two",url:"https://liveak.alkass.net/live/alkass2/playlist.m3u8"},
{name:"Alkass Three",url:"https://liveak.alkass.net/live/alkass3/playlist.m3u8"},
{name:"Alkass Four",url:"https://liveak.alkass.net/live/alkass4/playlist.m3u8"},
{name:"Alkass Five",url:"https://liveak.alkass.net/live/alkass5/playlist.m3u8"}

];

function loadAlkassChannels(){

const container=document.querySelector(".channelsContainer");

container.innerHTML="";

alkassChannels.forEach(ch=>{

const div=document.createElement("div");

div.className="channelCard";

div.innerText=ch.name;

div.onclick=()=>playChannel(ch.url);

container.appendChild(div);

});

}

/* ================= PLAYER ================= */

function playChannel(url){

const player=document.getElementById("player");
const video=document.getElementById("video");

player.style.display="block";
video.src=url;
video.play();

}

/* ================= MATCHES (Firebase مكانه لاحقاً) ================= */

function loadMatches(){

const container=document.querySelector(".matchesContainer");

if(!container) return;

container.innerHTML=`
<div class="matchCard">
جاري تجهيز المباريات...
</div>
`;

}

loadMatches();

</script>

</body>
  </html>
