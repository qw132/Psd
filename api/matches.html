<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>معرفات مباريات كأس العالم</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#0f5f2c;
padding:20px;
}

.container{
max-width:950px;
margin:auto;
}

h1{
text-align:center;
color:#fff;
margin-bottom:20px;
font-size:30px;
}

.topBar{
display:flex;
gap:10px;
margin-bottom:20px;
}

#search{
flex:1;
padding:12px;
border:none;
border-radius:12px;
font-size:16px;
outline:none;
}

.reloadBtn{
padding:12px 25px;
border:none;
border-radius:12px;
background:#007bff;
color:white;
font-weight:bold;
cursor:pointer;
}

.loading{
background:white;
padding:30px;
border-radius:20px;
font-size:20px;
font-weight:bold;
text-align:center;
}

.matchCard{
background:white;
padding:18px;
border-radius:18px;
margin-bottom:15px;
box-shadow:0 5px 18px rgba(0,0,0,.18);
}

.teams{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.team{
width:35%;
text-align:center;
}

.team img{
width:70px;
height:70px;
object-fit:contain;
}

.teamName{
margin-top:8px;
font-size:16px;
font-weight:bold;
}

.center{
width:30%;
text-align:center;
}

.matchTime{
font-size:17px;
font-weight:bold;
margin-bottom:8px;
}

.matchStatus{
font-size:15px;
font-weight:bold;
color:#0f7a39;
}

.idBox{
margin-top:12px;
background:#efefef;
padding:12px;
border-radius:10px;
font-size:15px;
font-weight:bold;
}

.copyBtn{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:10px;
background:#222;
color:white;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>معرفات مباريات كأس العالم 2026</h1>

<div class="topBar">

<input
id="search"
placeholder="ابحث باسم منتخب">

<button
class="reloadBtn"
onclick="loadMatches()">
تحديث
</button>

</div>

<div id="matches">

<div class="loading">
جاري تحميل المباريات...
</div>

</div>

</div>

<script>

let apiMatches=[];
let searchText="";

document
.getElementById("search")
.addEventListener("input",e=>{

searchText=e.target.value.trim().toLowerCase();

renderMatches();

});

async function loadMatches(){

document.getElementById("matches").innerHTML=`
<div class="loading">
جاري تحميل المباريات...
</div>
`;

try{

const response=await fetch("/api/matches");

const data=await response.json();

apiMatches=data.matches||[];

renderMatches();

}catch(error){

document.getElementById("matches").innerHTML=`
<div class="loading">
فشل تحميل المباريات
</div>
`;

console.log(error);

}

}

function copyId(id){

navigator.clipboard.writeText(id);

alert("تم نسخ معرف المباراة");

}
  function renderMatches(){

const container=document.getElementById("matches");

let html="";

const search=searchText.toLowerCase();

apiMatches.forEach(match=>{

const team1=match.homeTeam.name;
const team2=match.awayTeam.name;

if(

search!=="" &&

!team1.toLowerCase().includes(search) &&

!team2.toLowerCase().includes(search)

){

return;

}

const matchDate=new Date(match.utcDate);

html+=`

<div class="matchCard">

<div class="teams">

<div class="team">

<img
src="${match.homeTeam.crest}"
alt="">

<div class="teamName">

${team1}

</div>

</div>

<div class="center">

<div class="matchTime">

${matchDate.toLocaleDateString("ar-EG")}

<br>

${matchDate.toLocaleTimeString("ar-EG",{
hour:"2-digit",
minute:"2-digit"
})}

</div>

<div class="matchStatus">

${match.status}

</div>

<div class="idBox">

🆔 ${match.id}

</div>

<button

class="copyBtn"

onclick="copyId('${match.id}')">

نسخ المعرف

</button>

</div>

<div class="team">

<img
src="${match.awayTeam.crest}"
alt="">

<div class="teamName">

${team2}

</div>

</div>

</div>

</div>

`;

});

if(html===""){

html=`

<div class="loading">

لا توجد مباريات

</div>

`;

}

container.innerHTML=html;

}

loadMatches();

setInterval(loadMatches,30000);

</script>

</body>

</html>
