<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>إدارة البث | ماتشات</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

:root{
--bg:#0d0d0d;
--card:#1b1b1b;
--header:#141414;
--input:#242424;
--border:#353535;
--blue:#2563eb;
--green:#16a34a;
--red:#dc2626;
}

body{
background:var(--bg);
color:#fff;
}

#login{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#0d0d0d;
z-index:999;
}

.loginBox{
width:420px;
max-width:92%;
background:var(--card);
padding:35px;
border-radius:22px;
}

.logo{
width:180px;
display:block;
margin:auto;
margin-bottom:20px;
}

.title{
text-align:center;
font-size:24px;
font-weight:800;
margin-bottom:20px;
}

input,
select{
width:100%;
height:54px;
margin-bottom:15px;
background:var(--input);
border:1px solid var(--border);
border-radius:15px;
padding:0 15px;
color:white;
font-size:15px;
outline:none;
}

button{
width:100%;
height:54px;
border:none;
border-radius:15px;
font-size:16px;
font-weight:800;
cursor:pointer;
color:white;
}

.blue{
background:var(--blue);
}

.green{
background:var(--green);
}

#error{
margin-top:10px;
text-align:center;
color:#ff6666;
font-weight:bold;
}

#app{
display:none;
}

header{
position:fixed;
top:0;
right:0;
left:0;
height:72px;
background:var(--header);
display:flex;
justify-content:center;
align-items:center;
z-index:99;
}

header img{
width:170px;
}

.container{
max-width:900px;
margin:auto;
padding:95px 15px 30px;
}

.card{
background:var(--card);
border-radius:22px;
padding:22px;
margin-bottom:20px;
}

.card h2{
text-align:center;
margin-bottom:20px;
font-size:22px;
}

#matchInfo{
display:none;
margin-bottom:18px;
}

.teams{
display:flex;
justify-content:space-between;
align-items:center;
}

.team{
width:40%;
text-align:center;
}

.team img{
width:70px;
height:70px;
object-fit:contain;
display:block;
margin:auto;
}

.teamName{
margin-top:8px;
font-weight:800;
}

.vs{
font-size:24px;
font-weight:800;
}

.liveList{
display:flex;
flex-direction:column;
gap:15px;
}

.liveCard{
background:#232323;
border-radius:18px;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.info{
flex:1;
}

.match{
font-size:17px;
font-weight:800;
margin-bottom:5px;
}

.stage{
font-size:14px;
color:#cfcfcf;
}

.buttons{
display:flex;
gap:8px;
}

.buttons button{
width:46px;
height:46px;
padding:0;
border-radius:12px;
}

.edit{
background:var(--blue);
}

.delete{
background:var(--red);
}

</style>

</head>

<body>

<div id="login">

<div class="loginBox">

<img src="YOUR_LOGO.png" class="logo">

<div class="title">
لوحة إدارة البث
</div>

<input
id="password"
type="password"
placeholder="كلمة المرور">

<button
class="blue"
onclick="login()">
دخول
</button>

<div id="error"></div>

</div>

</div>

<div id="app">

<header>

<img src="YOUR_LOGO.png">

</header>

<div class="container">

<div class="card">

<h2>إضافة أو تعديل بث</h2>

<input
id="eventId"
placeholder="معرف المباراة">

<button
id="loadMatch"
class="blue">
جلب المباراة
</button>

<div id="matchInfo">

<div class="teams">

<div class="team">

<img id="logo1">

<div
id="team1"
class="teamName"></div>

</div>

<div class="vs">
VS
</div>

<div class="team">

<img id="logo2">

<div
id="team2"
class="teamName"></div>

</div>

</div>

</div>

<select id="streamType">

<option value="website">
Website
</option>

<option value="youtube">
YouTube
</option>

</select>

<input
id="streamUrl"
placeholder="رابط البث">

<input
id="background"
placeholder="رابط الخلفية (اختياري)">

<button
id="saveLive"
class="green">
حفظ البث
</button>

  </div>
  <div class="card">

<h2>البثوث الحالية</h2>

<div
id="liveList"
class="liveList">

</div>

</div>

</div>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,

doc,

getDoc,

setDoc,

deleteDoc,

collection,

getDocs,

query,

where

  }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyCDoHtDphHNZoZfCV2pXqJ3LD8JzzXSHFw",

authDomain:"match3t.firebaseapp.com",

projectId:"match3t",

storageBucket:"match3t.firebasestorage.app",

messagingSenderId:"966340184804",

appId:"1:966340184804:web:aedda5fac457d0907e3af1"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const PASSWORD="01276557203";

const $=id=>document.getElementById(id);

const LOGO="YOUR_LOGO.png";

let matchData=null;

window.login=()=>{

if($("password").value!==PASSWORD){

$("error").textContent="كلمة المرور غير صحيحة";

return;

}

sessionStorage.setItem("adminLive","1");

$("login").style.display="none";

$("app").style.display="block";

loadLives();

};

if(sessionStorage.getItem("adminLive")){

$("login").style.display="none";

$("app").style.display="block";

loadLives();

}

$("loadMatch").onclick=async()=>{

const id=$("eventId").value.trim();

if(!id) return;

const q=query(

collection(db,"matches"),

where("eventId","==",id)

);

const result=await getDocs(q);

if(result.empty){

alert("المباراة غير موجودة");

return;

}

const snap=result.docs[0];
  
matchData=snap.data();

$("matchInfo").style.display="block";

$("team1").textContent=matchData.team1;

$("team2").textContent=matchData.team2;

$("logo1").src=matchData.logo1;

$("logo2").src=matchData.logo2;

const live=await getDoc(doc(db,"liveStreams",id));

if(live.exists()){

const d=live.data();

$("streamType").value=d.type;

$("streamUrl").value=d.url;

$("background").value=d.background||"";

}else{

$("streamType").value="website";

$("streamUrl").value="";

$("background").value="";

}

};

$("saveLive").onclick=async()=>{

const id=$("eventId").value.trim();

if(!id){

alert("أدخل معرف المباراة");

return;

}

let url=$("streamUrl").value.trim();

if(!url){

alert("أدخل رابط البث");

return;

}

if($("streamType").value==="youtube"){

if(url.includes("watch?v="))

url="https://www.youtube.com/embed/"+url.split("watch?v=")[1].split("&")[0];

if(url.includes("youtu.be/"))

url="https://www.youtube.com/embed/"+url.split("youtu.be/")[1].split("?")[0];

}
  const background=$("background").value.trim();

await setDoc(

doc(db,"liveStreams",id),

{

eventId:id,

type:$("streamType").value,

url:url,

background:background

},

{

merge:true

}

);

alert("تم حفظ البث");

loadLives();

};

async function loadLives(){

$("liveList").innerHTML="";

const lives=await getDocs(collection(db,"liveStreams"));

for(const live of lives.docs){

const data=live.data();

const q=query(

collection(db,"matches"),

where("eventId","==",data.eventId)

);

const result=await getDocs(q);

if(result.empty) continue;

const m=result.docs[0].data();

$("liveList").innerHTML+=`

<div class="liveCard">

<div class="info">

<div class="match">

${m.team1} × ${m.team2}

</div>

<div class="stage">

${m.group||""}

</div>

</div>

<div class="buttons">

<button

class="edit"

onclick="editLive('${data.eventId}')">

✏

</button>

<button

class="delete"

onclick="deleteLive('${data.eventId}')">

🗑

</button>

</div>

</div>

`;

}

  }
  window.editLive=async(id)=>{

const live=await getDoc(doc(db,"liveStreams",id));

if(!live.exists()) return;

const d=live.data();

$("eventId").value=id;

$("streamType").value=d.type;

$("streamUrl").value=d.url;

$("background").value=d.background||"";

await $("loadMatch").onclick();

window.scrollTo({

top:0,

behavior:"smooth"

});

};

window.deleteLive=async(id)=>{

if(!confirm("حذف هذا البث ؟")) return;

await deleteDoc(

doc(db,"liveStreams",id)

);

loadLives();

};

document.getElementById("password")

.addEventListener(

"keydown",

e=>{

if(e.key==="Enter") login();

}

);

window.addEventListener(

"load",

()=>{

if(sessionStorage.getItem("adminLive")){

loadLives();

}

}

);

</script>

</body>

</html>
