<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>لوحة إدارة البث | ماتشات</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

:root{

--bg:#0d0d0d;
--card:#1b1b1b;
--header:#151515;
--input:#242424;
--border:#323232;
--blue:#2563eb;
--green:#16a34a;
--red:#dc2626;
--yellow:#f59e0b;
--text:#ffffff;
--gray:#cfcfcf;

}

body{

background:var(--bg);
color:var(--text);

}

/*=========================
LOGIN
=========================*/

#loginPage{

position:fixed;

top:0;
left:0;
right:0;
bottom:0;

display:flex;

justify-content:center;

align-items:center;

background:#0d0d0d;

z-index:99999;

}

.loginBox{

width:420px;

max-width:92%;

background:#1a1a1a;

padding:35px;

border-radius:24px;

box-shadow:0 10px 30px rgba(0,0,0,.45);

}

.loginLogo{

width:180px;

display:block;

margin:auto;

margin-bottom:25px;

}

.loginTitle{

font-size:25px;

font-weight:800;

text-align:center;

margin-bottom:25px;

}

.input{

width:100%;

height:54px;

background:var(--input);

border:1px solid var(--border);

border-radius:15px;

padding:0 16px;

font-size:15px;

color:white;

outline:none;

margin-bottom:16px;

}

.input:focus{

border-color:var(--blue);

}

.mainButton{

width:100%;

height:54px;

border:none;

border-radius:15px;

background:var(--blue);

color:white;

font-size:17px;

font-weight:800;

cursor:pointer;

transition:.25s;

}

.mainButton:hover{

transform:scale(.99);

}

#error{

margin-top:15px;

text-align:center;

font-weight:700;

color:#ff6b6b;

}

/*=========================
ADMIN
=========================*/

#adminPage{

display:none;

}

.header{

position:fixed;

top:0;
right:0;
left:0;

height:72px;

background:var(--header);

display:flex;

justify-content:center;

align-items:center;

z-index:999;

box-shadow:0 3px 12px rgba(0,0,0,.35);

}

.headerLogo{

width:170px;

}

.container{

max-width:950px;

margin:auto;

padding:95px 15px 35px;

}

.card{

background:var(--card);

border-radius:22px;

padding:22px;

margin-bottom:20px;

}

.cardTitle{

font-size:23px;

font-weight:800;

text-align:center;

margin-bottom:20px;

}

#previewBackground{

width:100%;

height:180px;

background:#252525;

border-radius:18px;

background-position:center;

background-size:cover;

background-repeat:no-repeat;

border:1px solid #333;

margin-bottom:18px;

}

.select{

width:100%;

height:54px;

background:var(--input);

border:1px solid var(--border);

border-radius:15px;

padding:0 15px;

color:white;

font-size:15px;

outline:none;

margin-bottom:15px;

}

.saveBtn{

width:100%;

height:55px;

background:var(--green);

border:none;

border-radius:15px;

color:white;

font-size:17px;

font-weight:800;

cursor:pointer;

}

.liveList{

display:flex;

flex-direction:column;

gap:15px;

}

.liveCard{

background:#232323;

border-radius:18px;

padding:18px;

display:flex;

justify-content:space-between;

align-items:center;

gap:15px;

}

.liveInfo{

flex:1;

}

.liveMatch{

font-size:18px;

font-weight:800;

margin-bottom:8px;

}

.liveMeta{

font-size:14px;

color:#cfcfcf;

line-height:1.7;

}

.actions{

display:flex;

gap:8px;

}

.actionBtn{

width:46px;

height:46px;

border:none;

border-radius:12px;

color:white;

font-size:18px;

cursor:pointer;

}

.previewBtn{

background:var(--green);

}

.editBtn{

background:var(--blue);

}

.toggleBtn{

background:#666;

}

.deleteBtn{

background:var(--red);

}

.logout{

margin-top:20px;

width:100%;

height:54px;

background:var(--red);

border:none;

border-radius:15px;

font-size:17px;

font-weight:800;

color:white;

cursor:pointer;

}

</style>

</head>

<body>

<div id="loginPage">

<div class="loginBox">

<img src="YOUR_LOGO.png" class="loginLogo">

<div class="loginTitle">

لوحة إدارة البث المباشر

</div>

<input
id="password"
class="input"
type="password"
placeholder="أدخل كلمة المرور">

<button
class="mainButton"
onclick="login()">

دخول

</button>

<div id="error"></div>

</div>

</div>

<div id="adminPage">

<header class="header">

<img src="YOUR_LOGO.png" class="headerLogo">

</header>

<div class="container">

<div class="card">

<div class="cardTitle">

إضافة أو تعديل بث

  </div>
  <div id="previewBackground"></div>

<select
id="matchSelect"
class="select">

<option value="">

جاري تحميل المباريات...

</option>

</select>

<select
id="streamType"
class="select">

<option value="website">

🌐 Website

</option>

<option value="youtube">

▶ YouTube

</option>

</select>

<input
id="streamUrl"
class="input"
type="text"
placeholder="رابط البث">

<input
id="background"
class="input"
type="text"
placeholder="رابط خلفية بطاقة البث">

<button
id="saveBtn"
class="saveBtn">

💾 حفظ البث

</button>

</div>

<div class="card">

<div class="cardTitle">

البثوث الحالية

</div>

<div
id="liveList"
class="liveList">

</div>

</div>

<button
class="logout"
onclick="logout()">

تسجيل الخروج

</button>

</div>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,

collection,

doc,

getDoc,

getDocs,

setDoc,

updateDoc,

deleteDoc,

onSnapshot

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyCDoHtDphHNZoZfCV2pXqJ3LD8JzzXSHFw",

authDomain:"match3t.firebaseapp.com",

projectId:"match3t",

storageBucket:"match3t.firebasestorage.app",

messagingSenderId:"966340184804",

appId:"1:966340184804:web:aedda5fac457d0907e3af1"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const PASSWORD="01276557203";

let editMode=false;

let editId=null;

/*======================
تسجيل الدخول
======================*/

window.login=function(){

const pass=document.getElementById("password").value.trim();

if(pass!==PASSWORD){

document.getElementById("error").innerHTML="كلمة المرور غير صحيحة";

return;

}

sessionStorage.setItem("adminLive","1");

document.getElementById("loginPage").style.display="none";

document.getElementById("adminPage").style.display="block";

loadMatches();

listenLives();

}

/*======================
استعادة الجلسة
======================*/

if(sessionStorage.getItem("adminLive")){

document.getElementById("loginPage").style.display="none";

document.getElementById("adminPage").style.display="block";

loadMatches();

listenLives();

}

/*======================
تحميل المباريات
======================*/

async function loadMatches(){

const select=document.getElementById("matchSelect");

select.innerHTML="";

const snap=await getDocs(collection(db,"matches"));

snap.forEach(match=>{

const data=match.data();

select.innerHTML+=`

<option value="${match.id}">

${data.team1} × ${data.team2}

</option>

`;

});

}

/*======================
معاينة الخلفية
======================*/

const preview=document.getElementById("previewBackground");

document.getElementById("background")

.addEventListener(

"input",

e=>{

const url=e.target.value.trim();

preview.style.backgroundImage=

url ? `url('${url}')` : "none";

}

);
  /*======================
تحويل رابط يوتيوب
======================*/

function convertYoutube(url){

if(url.includes("/embed/")) return url;

let id="";

if(url.includes("watch?v=")){

id=url.split("watch?v=")[1];

if(id.includes("&")){

id=id.split("&")[0];

}

}

else if(url.includes("youtu.be/")){

id=url.split("youtu.be/")[1];

if(id.includes("?")){

id=id.split("?")[0];

}

}

if(id==="") return url;

return `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;

}

/*======================
حفظ البث
======================*/

document.getElementById("saveBtn")

.addEventListener(

"click",

saveLive

);

async function saveLive(){

const eventId=

document.getElementById("matchSelect").value;

let url=

document.getElementById("streamUrl").value.trim();

const type=

document.getElementById("streamType").value;

const background=

document.getElementById("background").value.trim();

if(eventId===""){

alert("اختر المباراة");

return;

}

if(url===""){

alert("أدخل رابط البث");

return;

}

if(background===""){

alert("أدخل رابط الخلفية");

return;

}

if(type==="youtube"){

url=convertYoutube(url);

}

const ref=

doc(db,"liveStreams",eventId);

await setDoc(

ref,

{

eventId,

type,

url,

background,

enabled:true,

updatedAt:Date.now()

},

{

merge:true

}

);

editMode=false;

editId=null;

document.getElementById("saveBtn").innerHTML="💾 حفظ البث";

document.getElementById("streamUrl").value="";

document.getElementById("background").value="";

document.getElementById("matchSelect").selectedIndex=0;

document.getElementById("streamType").selectedIndex=0;

preview.style.backgroundImage="none";

alert("تم حفظ البث بنجاح");

}

/*======================
عرض البثوث
======================*/

function listenLives(){

onSnapshot(

collection(db,"liveStreams"),

async(snapshot)=>{

const container=

document.getElementById("liveList");

container.innerHTML="";

if(snapshot.empty){

container.innerHTML=

`<div style="text-align:center;padding:20px;color:#bbb;">
لا توجد بثوث حالياً
</div>`;

return;

}

for(const liveDoc of snapshot.docs){

const live=liveDoc.data();

const matchSnap=

await getDoc(

doc(db,"matches",live.eventId)

);

if(!matchSnap.exists()) continue;

const match=matchSnap.data();

container.innerHTML+=`

<div class="liveCard">

<div class="liveInfo">

<div class="liveMatch">

${match.team1} × ${match.team2}

</div>

<div class="liveMeta">

${match.group || ""}<br>

${live.type==="youtube"?"YouTube":"Website"}<br>

${live.enabled?"🟢 مفعل":"🔴 متوقف"}

</div>

</div>

<div class="actions">

<button
class="actionBtn previewBtn"
onclick="previewLive('${live.eventId}')">

👁

</button>

<button
class="actionBtn editBtn"
onclick="editLive('${live.eventId}')">

✏

</button>

<button
class="actionBtn toggleBtn"
onclick="toggleLive('${live.eventId}',${live.enabled})">

${live.enabled?"⏸":"▶"}

</button>

<button
class="actionBtn deleteBtn"
onclick="deleteLive('${live.eventId}')">

🗑

</button>

</div>

</div>

`;

}

}

);

  }
  /*======================
معاينة البث
======================*/

window.previewLive=function(eventId){

window.open(

"live.html?id="+eventId,

"_blank"

);

};

/*======================
تعديل البث
======================*/

window.editLive=async function(eventId){

const snap=await getDoc(

doc(db,"liveStreams",eventId)

);

if(!snap.exists()) return;

const live=snap.data();

editMode=true;

editId=eventId;

document.getElementById("matchSelect").value=eventId;

document.getElementById("streamType").value=live.type;

document.getElementById("streamUrl").value=live.url;

document.getElementById("background").value=live.background;

preview.style.backgroundImage=

`url('${live.background}')`;

document.getElementById("saveBtn").innerHTML=

"✏ تحديث البث";

window.scrollTo({

top:0,

behavior:"smooth"

});

};

/*======================
تشغيل / إيقاف البث
======================*/

window.toggleLive=async function(eventId,state){

await updateDoc(

doc(db,"liveStreams",eventId),

{

enabled:!state,

updatedAt:Date.now()

}

);

};

/*======================
حذف البث
======================*/

window.deleteLive=async function(eventId){

const ok=confirm(

"هل تريد حذف هذا البث؟"

);

if(!ok) return;

await deleteDoc(

doc(db,"liveStreams",eventId)

);

};

/*======================
تسجيل الخروج
======================*/

window.logout=function(){

sessionStorage.removeItem("adminLive");

location.reload();

};

/*======================
زر Enter لتسجيل الدخول
======================*/

document

.getElementById("password")

.addEventListener(

"keydown",

e=>{

if(e.key==="Enter"){

login();

}

}

);

/*======================
زر ESC لإلغاء التعديل
======================*/

document.addEventListener(

"keydown",

e=>{

if(e.key==="Escape"){

editMode=false;

editId=null;

document.getElementById("matchSelect").selectedIndex=0;

document.getElementById("streamType").selectedIndex=0;

document.getElementById("streamUrl").value="";

document.getElementById("background").value="";

preview.style.backgroundImage="none";

document.getElementById("saveBtn").innerHTML=

"💾 حفظ البث";

}

}

);

/*======================
نسخة النظام
======================*/

console.log(

"Matchat Live Admin V3 Loaded"

);

</script>

</body>

</html>
