<style>

.header{

.logo{

}

.container{

}

.card{

}

.title{

font-size:23px;

text-align:center;

}

.input{

width:100%;

height:52px;

border:none;

outline:none;

background:var(--input);

color:white;

}

.select{

}

}

}

.actions{

display:flex;

gap:10px;

}

.actions button{

width:46px;

height:46px;

border-radius:12px;

color:white;

font-size:18px;

}

.preview{

background:#16a34a;

}

.edit{

background:#2563eb;

}

.toggle{

background:#555;

}

.delete{

background:#dc2626;

}

.logout{

margin-top:18px;

width:100%;

height:50px;

border:none;

border-radius:15px;

background:#444;

color:white;

font-size:17px;

font-weight:800;

}

.previewBackground{

width:100%;

height:170px;

border-radius:18px;

background:#222;

background-size:cover;

}

</style>

</head>

<body>

<div id="loginPage">

<div class="loginCard">

<img
src="file_00000000d0f871f4b728f73dff260688_1 (1).png"
class="loginLogo">

<div class="loginTitle">

لوحة إدارة البث المباشر

</div>

<input
type="password"
id="password"
class="loginInput"
placeholder="أدخل كلمة المرور">

<button
class="loginBtn"
onclick="login()">

دخول

</button>

<div id="error"></div>

</div>

</div>

<div id="adminPage">

<header class="header">

<img
src="file_00000000d0f871f4b728f73dff260688_1 (1).png"
class="logo">

</header>

<div class="container">

<div class="card">

<div class="title">

إضافة / تعديل بث مباشر

</div>
<div class="previewBackground" id="previewBackground"></div>

<select
id="matchSelect"
class="select">

<option value="">

جاري تحميل المباريات...

</option>

</select>

<select
id="streamType"
class="select">

<option value="website">

🌐 Website

</option>

<option value="youtube">

▶️ YouTube

</option>

</select>

<input
type="text"
id="streamUrl"
class="input"
placeholder="رابط البث">

<input
type="text"
id="background"
class="input"
placeholder="رابط صورة خلفية البطاقة">

<button
id="saveBtn"
class="saveBtn">

💾 حفظ البث

</button>

</div>

<div class="card">

<div class="title">

البثوث الحالية

</div>

<div
id="liveList"
class="liveList">

</div>

<button
class="logout"
onclick="logout()">

تسجيل الخروج

</button>

</div>

</div>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,

collection,

doc,

getDoc,

getDocs,

setDoc,

updateDoc,

deleteDoc,

onSnapshot

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/*==========================
Firebase
==========================*/

const firebaseConfig={

apiKey:"AIzaSyCDoHtDphHNZoZfCV2pXqJ3LD8JzzXSHFw",

authDomain:"match3t.firebaseapp.com",

projectId:"match3t",

storageBucket:"match3t.firebasestorage.app",

messagingSenderId:"966340184804",

appId:"1:966340184804:web:aedda5fac457d0907e3af1"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

/*==========================
Variables
==========================*/

const PASSWORD="01276557203";

let editMode=false;

let currentId=null;

/*==========================
Login
==========================*/

window.login=function(){

const pass=document.getElementById("password").value;

if(pass===PASSWORD){

sessionStorage.setItem("liveAdmin","true");

document.getElementById("loginPage").style.display="none";

document.getElementById("adminPage").style.display="block";

loadMatches();

listenLives();

}

else{

document.getElementById("error").innerHTML="كلمة المرور غير صحيحة";

}

}

window.logout=function(){

sessionStorage.removeItem("liveAdmin");

location.reload();

}

if(sessionStorage.getItem("liveAdmin")==="true"){

document.getElementById("loginPage").style.display="none";

document.getElementById("adminPage").style.display="block";

loadMatches();

listenLives();

}

/*==========================
تحميل المباريات
==========================*/

async function loadMatches(){

const select=document.getElementById("matchSelect");

select.innerHTML="";

const snap=await getDocs(collection(db,"matches"));

snap.forEach(d=>{

const m=d.data();

select.innerHTML+=`

<option value="${d.id}">

${m.team1} × ${m.team2}

</option>

`;

});

}
  /*==========================
معاينة الخلفية
==========================*/

const bgInput=document.getElementById("background");

const bgPreview=document.getElementById("previewBackground");

bgInput.addEventListener("input",()=>{

const url=bgInput.value.trim();

if(url===""){

bgPreview.style.backgroundImage="none";

return;

}

bgPreview.style.backgroundImage=`url('${url}')`;

});

/*==========================
تحويل روابط يوتيوب
==========================*/

function youtubeEmbed(url){

if(!url) return "";

if(url.includes("/embed/")) return url;

let id="";

if(url.includes("watch?v=")){

id=url.split("watch?v=")[1];

if(id.includes("&")){

id=id.split("&")[0];

}

}

else if(url.includes("youtu.be/")){

id=url.split("youtu.be/")[1];

if(id.includes("?")){

id=id.split("?")[0];

}

}

if(id==="") return url;

return `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;

}

/*==========================
حفظ البث
==========================*/

document.getElementById("saveBtn").onclick=saveLive;

async function saveLive(){

const eventId=document.getElementById("matchSelect").value;

let url=document.getElementById("streamUrl").value.trim();

const type=document.getElementById("streamType").value;

const background=document.getElementById("background").value.trim();

if(eventId===""){

alert("اختر المباراة");

return;

}

if(url===""){

alert("أدخل رابط البث");

return;

}

if(background===""){

alert("أدخل رابط الخلفية");

return;

}

if(type==="youtube"){

url=youtubeEmbed(url);

}

const liveRef=doc(db,"liveStreams",eventId);

const liveSnap=await getDoc(liveRef);

if(liveSnap.exists() && !editMode){

alert("هذه المباراة لها بث بالفعل");

return;

}

await setDoc(

liveRef,

{

eventId:eventId,

type:type,

url:url,

background:background,

enabled:true,

updatedAt:Date.now()

},

{

merge:true

}

);

alert(editMode ? "تم تحديث البث" : "تم إضافة البث");

editMode=false;

currentId=null;

document.getElementById("saveBtn").innerHTML="💾 حفظ البث";

document.getElementById("streamUrl").value="";

document.getElementById("background").value="";

document.getElementById("matchSelect").selectedIndex=0;

document.getElementById("streamType").selectedIndex=0;

bgPreview.style.backgroundImage="none";

  }
  /*==========================
عرض جميع البثوث
==========================*/

function listenLives(){

onSnapshot(

collection(db,"liveStreams"),

async(snapshot)=>{

const container=document.getElementById("liveList");

container.innerHTML="";

for(const liveDoc of snapshot.docs){

const live=liveDoc.data();

const matchSnap=await getDoc(

doc(db,"matches",live.eventId)

);

if(!matchSnap.exists()) continue;

const match=matchSnap.data();

container.innerHTML+=`

<div class="liveCard">

<div class="liveInfo">

<div class="liveMatch">

${match.team1} × ${match.team2}

</div>

<div class="liveStatus">

${match.group || ""}

<br>

${live.type==="youtube" ? "YouTube" : "Website"}

<br>

${live.enabled ? "🟢 مفعل" : "🔴 متوقف"}

</div>

</div>

<div class="actions">

<button

class="preview"

onclick="previewLive('${live.eventId}')"

title="معاينة">

👁

</button>

<button

class="edit"

onclick="editLive('${live.eventId}')"

title="تعديل">

✏

</button>

<button

class="toggle"

onclick="toggleLive('${live.eventId}',${live.enabled})"

title="تشغيل / إيقاف">

${live.enabled ? "⏸" : "▶"}

</button>

<button

class="delete"

onclick="deleteLive('${live.eventId}')"

title="حذف">

🗑

</button>

</div>

</div>

`;

}

}

);

}

/*==========================
معاينة
==========================*/

window.previewLive=function(id){

window.open(

"live.html?id="+id,

"_blank"

);

}

/*==========================
تعديل
==========================*/

window.editLive=async function(id){

const snap=await getDoc(

doc(db,"liveStreams",id)

);

if(!snap.exists()) return;

const live=snap.data();

editMode=true;

currentId=id;

document.getElementById("matchSelect").value=id;

document.getElementById("streamType").value=live.type;

document.getElementById("streamUrl").value=live.url;

document.getElementById("background").value=live.background;

bgPreview.style.backgroundImage=

`url('${live.background}')`;

document.getElementById("saveBtn").innerHTML=

"✏ تحديث البث";

window.scrollTo({

top:0,

behavior:"smooth"

});

  }
  /*==========================
تفعيل / إيقاف البث
==========================*/

window.toggleLive=async function(id,state){

await updateDoc(

doc(db,"liveStreams",id),

{

enabled:!state,

updatedAt:Date.now()

}

);

}

/*==========================
حذف البث
==========================*/

window.deleteLive=async function(id){

const ok=confirm(

"هل تريد حذف هذا البث؟"

);

if(!ok) return;

await deleteDoc(

doc(db,"liveStreams",id)

);

}

/*==========================
تحديث حالة المباراة تلقائياً
==========================*/

onSnapshot(

collection(db,"matches"),

(snapshot)=>{

snapshot.forEach(async(matchDoc)=>{

const liveRef=

doc(db,"liveStreams",matchDoc.id);

const liveSnap=

await getDoc(liveRef);

if(!liveSnap.exists()) return;

const match=

matchDoc.data();

await updateDoc(

liveRef,

{

status:match.status||"TIMED",

group:match.group||"GROUP_STAGE",

updatedAt:Date.now()

}

);

});

}

);

/*==========================
تنظيف النموذج
==========================*/

function clearForm(){

editMode=false;

currentId=null;

document.getElementById("matchSelect").selectedIndex=0;

document.getElementById("streamType").selectedIndex=0;

document.getElementById("streamUrl").value="";

document.getElementById("background").value="";

bgPreview.style.backgroundImage="none";

document.getElementById("saveBtn").innerHTML=

"💾 حفظ البث";

}

/*==========================
زر ESC لإلغاء التعديل
==========================*/

document.addEventListener(

"keydown",

(e)=>{

if(e.key==="Escape"){

clearForm();

}

}

);
  /*==========================
استعادة الجلسة
==========================*/

window.addEventListener(

"load",

()=>{

if(

sessionStorage.getItem("liveAdmin")==="true"

){

document.getElementById("loginPage").style.display="none";

document.getElementById("adminPage").style.display="block";

loadMatches();

listenLives();

}

}

/*==========================
زر Enter لتسجيل الدخول
==========================*/

);

document.getElementById("password")

.addEventListener(

"keydown",

(e)=>{

if(e.key==="Enter"){

login();

}

}

);

/*==========================
منع ظهور صورة تالفة
==========================*/

document.addEventListener(

"error",

(e)=>{

if(

e.target.tagName==="IMG"

){

e.target.style.display="none";

}

},

true

);

/*==========================
نسخة النظام
==========================*/

window.ADMIN_VERSION="2.0";

console.log(

"Matchat Live Admin v2.0 Loaded"

);

</script>

</body>
